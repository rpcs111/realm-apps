<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Realm Crew</title>
<style>
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#fff7d6,#ffe3f1 45%,#dff4ff);color:#2b2350}
header{padding:24px 16px;text-align:center;background:linear-gradient(90deg,#ff6fb5,#ffb347,#4fd1ff);color:#fff;text-shadow:0 2px 4px #0003}
header h1{margin:0;font-size:2.4em}a.back{color:#fff;font-weight:700}
main{max-width:1100px;margin:auto;padding:16px}
h2{color:#e0459b;font-size:1.6em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 6px 18px #ff6fb533;border-top:10px solid var(--c)}
.card h3{margin:0 0 6px;font-size:1.5em;color:var(--c)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:700;font-size:.85em;background:var(--c);color:#fff;margin-right:6px}
.card ul{padding-left:20px}.cost{font-size:.85em;color:#6b5fa0}
textarea{width:100%;min-height:260px;font-family:monospace;font-size:14px;border-radius:14px;border:3px solid #ffb347;padding:10px;box-sizing:border-box;background:#fffdf3}
button,.btn{background:#4fd1ff;color:#08325a;border:0;border-radius:14px;padding:12px 18px;font-size:1em;font-weight:700;margin:6px 6px 0 0;cursor:pointer;text-decoration:none;display:inline-block}
button.pink{background:#ff6fb5;color:#fff}button.orange{background:#ffb347}
#tree{background:#fff;border-radius:22px;padding:12px;margin-top:12px;overflow:auto}
.imgs img{width:100%;border-radius:18px;background:#fff}
</style></head><body>
<header><h1>Realm Crew</h1><p>Ange's AI family: who does what</p><a class="back" href="index.html">&larr; Back to Realm home</a></header>
<main>
<h2>Family tree (edit me)</h2>
<p>Change the text below and the tree redraws. Your changes save on this device.</p>
<textarea id="src"></textarea>
<button class="pink" onclick="render()">Redraw</button><button onclick="dl('svg')">Download SVG</button><button class="orange" onclick="dl('png')">Download PNG</button><button onclick="resetTree()">Reset</button>
<div id="tree"></div>

<h2>The crew</h2>
<div class="grid" id="cards"></div>

<h2>Got an idea? Rename or add a bot</h2>
<textarea id="idea" style="min-height:140px" placeholder="e.g. Rename Merchant to Shopkeeper. Add a bot for..."></textarea>
<button class="pink" onclick="copyIdea()">Copy</button><span id="saved"></span>

<h2>Pictures</h2>
<div class="grid imgs">
<div class="card" style="--c:#ff6fb5"><h3>Umbrella triage</h3><img src="img/umbrella.svg" alt="Umbrella triage"><a class="btn" href="img/umbrella.svg" download="realm-umbrella.svg">Download</a></div>
<div class="card" style="--c:#4fd1ff"><h3>Family tree</h3><img src="img/family.svg" alt="Family tree"><a class="btn" href="img/family.svg" download="realm-family.svg">Download</a></div>
</div>
<p style="text-align:center"><a class="btn" href="index.html">&larr; Back to Realm home</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
const COST='Inside Grok Heavy plan; no extra fee confirmed. Cap $400';
const bots=[
['ARA','#ff6fb5','Head of the crew (Grok). Ange\'s voice in the car, on desktop and phone.',['Runs every bot below','Talks to Nova'],'Live','Running'],
['NOVA','#8a7dff','Gemini backend partner.',['Handoff sheet','Google-side builds'],'Live','Running'],
['ECHO','#ff8a3d','The checker. Re-reads Ange\'s 38 rules, open tasks and the last conversation before every reply.',['Blocks repeats','Blocks missed steps'],'Planned','30 min'],
['IVOR','#22c58b','AI coach.',['Coaching nudges'],'Live','Already live'],
['FORGE','#ffb800','Realm ops.',['Desk','Cert Studio','You Got Me Bro','Roster','Realm Flow Map'],'Planned','1 hr'],
['MERCHANT','#4fb8ff','Frankie and Henry plus the online stores (Wix and Shopify).',['Orders','Stock','Listings'],'Planned','1 hr'],
['LEDGER','#00b3a4','Subscriptions and refunds.',['Subscription review','Refund chasing','Xero look-only','Deputy look-only'],'Planned','45 min'],
['SENTRY','#ff4f6d','Watches for banned tools re-linking to Ange\'s accounts.',['Claude','Zapier','n8n','Make','Fireflies'],'Planned','30 min'],
['MUSE','#c35cff','Personal life.',['Alivio','Goodfellas Car Club','Guitars','Watches','Bucket list','Home on Ellesmere Road'],'Planned','30 min'],
['ORACLE','#ffcc00','Stretch goal: five-year-goals strategist that turns visions into plans (God mode, rules 23 and 24).',['Five-year plan','Stratosphere ideas'],'Planned','1 hr plus Ange\'s goals session']];
document.getElementById('cards').innerHTML=bots.map(b=>`<div class="card" style="--c:${b[1]}"><h3>${b[0]}</h3><span class="tag">${b[4]}</span><span class="tag" style="background:#2b235033;color:#2b2350">Setup: ${b[5]}</span><p>${b[2]}</p><b>Hands down:</b><ul>${b[3].map(x=>'<li>'+x+'</li>').join('')}</ul><div class="cost">${COST}</div></div>`).join('');
const DEF=`flowchart TD
  ANGE([ANGE - Boss]):::boss
  ANGE --> ARA[ARA - Head, Grok<br/>car, desktop, phone]:::ara
  ANGE --> NOVA[NOVA - Gemini backend]:::nova
  ARA <--> NOVA
  ARA --> ECHO[ECHO - Checker]:::b1
  ARA --> IVOR[IVOR - AI coach, LIVE]:::b2
  ARA --> FORGE[FORGE - Realm ops]:::b3
  ARA --> MERCHANT[MERCHANT - Frankie and Henry, stores]:::b4
  ARA --> LEDGER[LEDGER - Subs and refunds]:::b5
  ARA --> SENTRY[SENTRY - Banned-tool watch]:::b6
  ARA --> MUSE[MUSE - Personal life]:::b7
  ARA --> ORACLE[ORACLE - Five-year goals]:::b8
  classDef boss fill:#ffb347,stroke:#ff6fb5,color:#fff,font-size:20px
  classDef ara fill:#ff6fb5,stroke:#fff,color:#fff
  classDef nova fill:#8a7dff,stroke:#fff,color:#fff
  classDef b1 fill:#ff8a3d,color:#fff
  classDef b2 fill:#22c58b,color:#fff
  classDef b3 fill:#ffd23f,color:#2b2350
  classDef b4 fill:#4fb8ff,color:#fff
  classDef b5 fill:#00b3a4,color:#fff
  classDef b6 fill:#ff4f6d,color:#fff
  classDef b7 fill:#c35cff,color:#fff
  classDef b8 fill:#ffe066,color:#2b2350`;
const src=document.getElementById('src');src.value=localStorage.getItem('realmCrewTree')||DEF;
mermaid.initialize({startOnLoad:false,flowchart:{htmlLabels:false},theme:'base',themeVariables:{lineColor:'#e0459b',primaryColor:'#fff3c4'}});
let n=0,t;
async function render(){localStorage.setItem('realmCrewTree',src.value);try{const {svg}=await mermaid.render('m'+(n++),src.value);document.getElementById('tree').innerHTML=svg}catch(e){document.getElementById('tree').innerHTML='<p style="color:#ff4f6d">Tree text has a mistake: '+e.message+'</p>'}}
src.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(render,600)});
function resetTree(){src.value=DEF;render()}
function save(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}
function dl(kind){const s=document.querySelector('#tree svg');if(!s)return;const x=new XMLSerializer().serializeToString(s);
 if(kind==='svg')return save(new Blob([x],{type:'image/svg+xml'}),'realm-crew.svg');
 const r=s.getBoundingClientRect(),c=document.createElement('canvas'),k=2;c.width=r.width*k;c.height=r.height*k;
 const i=new Image();i.onload=()=>{const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(i,0,0,c.width,c.height);c.toBlob(b=>save(b,'realm-crew.png'))};
 i.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(x)))}
const idea=document.getElementById('idea');idea.value=localStorage.getItem('realmCrewIdea')||'';
idea.addEventListener('input',()=>{localStorage.setItem('realmCrewIdea',idea.value);document.getElementById('saved').textContent=' Saved'});
function copyIdea(){navigator.clipboard.writeText(idea.value);document.getElementById('saved').textContent=' Copied'}
render();
</script></body></html>
