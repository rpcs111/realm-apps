<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Video Search</title>
<style>*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;background:#fff;color:#111827;font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif;padding:20px 16px 40px}.top a{display:inline-block;padding:12px 16px;border-radius:12px;background:#f3f4f6;color:#111827;text-decoration:none;font-weight:700;margin-bottom:12px}h1{font-size:24px;margin:0 0 12px}
form{display:flex;gap:8px}input{flex:1;min-width:0;font-size:17px;padding:14px;border:1px solid #d1d5db;border-radius:12px}button{padding:14px 16px;border:0;border-radius:12px;background:#dc2626;color:#fff;font:700 16px sans-serif}
ul{list-style:none;padding:0}li a{display:block;padding:14px;margin:8px 0;background:#f3f4f6;border-radius:12px;color:#111827;text-decoration:none;overflow-wrap:anywhere}#clr{background:#6b7280;margin-top:8px;display:none}</style></head><body>
<div class="top"><a href="./">&larr; Apps</a></div>
<h1>VIDEO SEARCH</h1>
<form id="f"><input id="q" type="search" placeholder="Search YouTube" autocomplete="off" required><button>Go</button></form>
<h2 style="font-size:15px;margin-top:18px">Recent searches</h2><ul id="r"></ul><button id="clr">Clear recent</button>
<script>
var K="realm_video_recent";function L(){try{return JSON.parse(localStorage.getItem(K))||[]}catch(e){return[]}}
function U(q){return"https://www.youtube.com/results?search_query="+encodeURIComponent(q)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function draw(){var a=L();document.getElementById("r").innerHTML=a.length?a.map(function(q){return'<li><a href="'+esc(U(q))+'">&#9654; '+esc(q)+'</a></li>'}).join(""):'<li style="color:#6b7280">None yet.</li>';document.getElementById("clr").style.display=a.length?"block":"none"}
document.getElementById("f").onsubmit=function(e){e.preventDefault();var q=document.getElementById("q").value.trim();if(!q)return;var a=L().filter(function(x){return x!==q});a.unshift(q);localStorage.setItem(K,JSON.stringify(a.slice(0,20)));draw();location.href=U(q)};
document.getElementById("clr").onclick=function(){localStorage.removeItem(K);draw()};draw();
</script></body></html>
