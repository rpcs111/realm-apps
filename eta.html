<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Realm ETA board</title>
<style>
body{margin:0;background:#000;color:#eee;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:18px 16px 6px}h1{margin:0;font-size:22px;letter-spacing:.5px}.sub{color:#888;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:12px 16px 24px}
.card{border:1px solid #222;border-radius:14px;padding:14px;background:#0a0a0a;border-left:6px solid #444}
.card.running{border-left-color:#22d3ee}.card.waiting{border-left-color:#f59e0b}.card.done{border-left-color:#22c55e}.card.notstarted{border-left-color:#ef4444}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.n{font-weight:700;font-size:17px}.chip{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:700;text-transform:uppercase;white-space:nowrap}
.running .chip{background:#083344;color:#67e8f9}.waiting .chip{background:#451a03;color:#fcd34d}.done .chip{background:#052e16;color:#86efac}.notstarted .chip{background:#450a0a;color:#fca5a5}
.eta{font-size:26px;font-weight:800;margin:8px 0 2px}.left{color:#bbb;font-size:14px}
a{color:#67e8f9}footer{color:#666;font-size:12px;padding:0 16px 20px}
</style></head><body>
<header><h1>Realm ETA board</h1><div class="sub" id="upd"></div></header>
<div class="grid" id="g"></div>
<footer>ETAs are Ara's estimates, not promises. Source of truth: <a href="https://github.com/rpcs111/realm-apps/blob/main/HANDOFF.md">HANDOFF.md §7 Live job log</a>. This page is updated when a job lands.</footer>
<script>
var UPDATED="Fri 16 Oct, 12:30pm Melbourne";
var ITEMS=[
{n:"1. Search Studio",s:"waiting",eta:"Your test",left:"Mic fix + phone fixes went live 15 Oct (live words, tap to stop, Notes repeat-words fix). Not yet checked by you on phone + laptop. Ara re-tests after the current builds.",u:"search.html"},
{n:"2. Side panel",s:"waiting",eta:"Your sign-off",left:"Built (apps down the side in Queue, sidebar in Prism). Needs your OK.",u:"queue.html"},
{n:"3. Base layer + nodes",s:"running",eta:"~1:30pm",left:"Queue: editable Job/Cert/Invoice/Outstanding/P&L/Close, 6 booking-status buttons, apps down the side. Plus mapper.html paste page. Testing phone + laptop, then live.",u:"queue.html"},
{n:"4. Nova",s:"waiting",eta:"After her reply",left:"Page live. Wake-up message is with you to paste. Then pipeline 1 (Receipts label) first; 2–4 need your yes for deploys. Data clean-up: sort and flag only.",u:"nova.html"},
{n:"5. Links, memory + Claude clean-out",s:"notstarted",eta:"~3pm",left:"Handover unified and live job log done. Still to do: strip Claude/Orion nodes and references from Prism, Flow Map and yesterday's step pages. Starts after item 3 lands.",u:"https://github.com/rpcs111/realm-apps/blob/main/HANDOFF.md"},
{n:"6. Layer map + Mend",s:"running",eta:"~1:30pm",left:"layers.html: layers 1–3, overlay, connectors, Mend on every item. Building now.",u:""},
{n:"Blocker: clasp sign-in",s:"waiting",eta:"Your sign-in",left:"Clasp's info@ login expired. Needs the localhost address back from your sign-in. Blocks Cert Studio test pushes.",u:""},
{n:"Cert Studio (Ara test copy)",s:"running",eta:"~2pm",left:"Fixing the Drive address search, checking undo, save, 12-month redo, two-places-open, unfinished-cert autosave. Live v6 untouched.",u:""}
];
document.getElementById('upd').textContent="Updated "+UPDATED;
var L={running:"Running",waiting:"Waiting",done:"Done",notstarted:"Not started"};
document.getElementById('g').innerHTML=ITEMS.map(function(i){return '<div class="card '+i.s+'"><div class="top"><div class="n">'+(i.u?'<a href="'+i.u+'">'+i.n+'</a>':i.n)+'</div><span class="chip">'+L[i.s]+'</span></div><div class="eta">'+i.eta+'</div><div class="left">'+i.left+'</div></div>'}).join('');
</script></body></html>
