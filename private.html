<style>
:root{--c:#22d3ee;--bg:#000;--card:#0b1114;--line:#16323a;--tx:#dff7fb;--mut:#7fa3ab;--bad:#ff6b6b;--ok:#34d399}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,textarea{font:inherit;color:inherit}
button{background:#0f1d22;border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}
button.pri{background:var(--c);color:#001318;border-color:var(--c);font-weight:600}
button.warn{border-color:#5a2020;color:#ffb4b4}
button.sm{min-height:34px;padding:6px 10px;font-size:14px}
input,textarea{background:#05090b;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--c);outline-offset:1px}
a{color:var(--c)}
.hide{display:none!important}
/* gate */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#000;z-index:10}
.gbox{width:100%;max-width:340px;text-align:center}
.lock{width:64px;height:64px;margin:0 auto 10px;border:3px solid var(--c);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px #22d3ee66}
.gbox h1{font-size:22px;margin:6px 0 2px}
.gbox p{color:var(--mut);font-size:14px;margin:6px 0 14px}
.dots{display:flex;gap:12px;justify-content:center;margin:12px 0 8px;min-height:18px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--c)}
.dots i.f{background:var(--c)}
#pin{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px auto 0;max-width:280px}
.pad button{font-size:22px;min-height:58px;border-radius:50%;aspect-ratio:1/1;width:72px;justify-self:center;padding:0}
.pad button.t{font-size:14px;border:none;background:none}
#gmsg{min-height:22px;font-size:14px;color:var(--bad);margin-top:8px}
.glinks{margin-top:14px;display:flex;justify-content:center;gap:16px}
.glinks button{background:none;border:none;color:var(--mut);font-size:13px;min-height:32px;text-decoration:underline}
/* app */
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#000d;backdrop-filter:blur(6px);z-index:2}
header h1{font-size:18px;margin:0;flex:1}
header .k{width:28px;height:28px;border:2px solid var(--c);border-radius:50%;display:flex;align-items:center;justify-content:center}
main{max-width:980px;margin:0 auto;padding:14px 14px 40px;display:grid;gap:14px}
@media(min-width:900px){main{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
section h2{font-size:15px;margin:0 0 10px;color:var(--c);letter-spacing:.3px;text-transform:uppercase}
.links{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.links li{display:flex;align-items:center;gap:8px}
.links a{flex:1;display:block;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--tx);background:#071014}
.links a small{display:block;color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input{flex:1;min-width:140px}
textarea#notes{min-height:220px;resize:vertical}
.st{font-size:12px;color:var(--mut)}
.edits{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.edits li{border:1px solid var(--line);border-radius:10px;padding:10px;background:#071014}
.edits time{display:block;color:var(--mut);font-size:12px;margin-bottom:4px}
.edits .tx{white-space:pre-wrap;word-break:break-word}
.note{font-size:13px;color:var(--mut);border-left:3px solid var(--c);padding:6px 10px;margin:0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#062a31;border:1px solid var(--c);padding:8px 14px;border-radius:20px;font-size:14px;z-index:20}
dialog{background:#071014;color:var(--tx);border:1px solid var(--c);border-radius:16px;max-width:340px;width:92%}
dialog::backdrop{background:#000c}
dialog label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
</style>

</head>

function tickLock(){clearInterval(lockTick);var w=lockWait();if(!w||mode!=='unlock')return;

 if(d==='del'){pinBuf=pinBuf.slice(0,-1)} else if(d==='ok'){submit();return} else if(pinBuf.length<6){pinBuf+=d}
 setDots(); if(mode!=='unlock'&&gmsg)0; }

 if(mode==='set2'){ if(p!==firstPin){mode='set1';firstPin='';pinBuf='';setDots();$('#gsub').textContent='Didn\u2019t match. Choose a 4–6 digit PIN';gmsg('PINs didn\u2019t match');return}
  busy=true;gmsg('Setting up…',true);salt=crypto.getRandomValues(new Uint8Array(16));
  derive(p,salt,ITER).then(function(k){cryptoKey=k;data={notes:'',links:[],edits:[]};return encryptSave()}).then(function(){busy=false;pinBuf='';firstPin='';okReset();openApp()});return}
 busy=true;gmsg('Checking…',true);var o=stored();if(!o){busy=false;showGate();return}
 var s=ub64(o.salt);
 derive(p,s,o.iter||ITER).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},k,ub64(o.ct)).then(function(pt){
   cryptoKey=k;salt=s;data=JSON.parse(dec.decode(pt));data.notes=data.notes||'';data.links=data.links||[];data.edits=data.edits||[];
   if((o.iter||ITER)!==ITER) encryptSave();
   busy=false;pinBuf='';okReset();openApp()})})
 .catch(function(){busy=false;pinBuf='';setDots();var l=fail();
   if(l.until&&lockWait()){tickLock()}else{gmsg('Wrong PIN'+(l.n>=3?' ('+(5-l.n)+' tries before a wait)':''))}});
}
