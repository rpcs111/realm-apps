<script>
var OWN={Ange:"#007aff",Ara:"#5856d6",Nova:"#34c759",Julie:"#ff2d55"},ON=Object.keys(OWN);
/* Storage adapter: swap to the Desk doPost/Sheet later by setting STORE.remote = exec URL. */
var STORE={key:"realm_scribe_v1",remote:"",
 mem:null,ok:(function(){try{var k="__t";localStorage.setItem(k,"1");localStorage.removeItem(k);return true}catch(e){return false}})(),
 load:function(){if(!this.ok)return this.mem||[];try{return JSON.parse(localStorage.getItem(this.key))||[]}catch(e){return[]}},
 save:function(a){this.mem=a;if(!this.ok)return true;try{localStorage.setItem(this.key,JSON.stringify(a));return true}catch(e){this.ok=false;warn("Phone storage is full, so new changes are kept until you close this tab.");return false}
  /* later: fetch(this.remote,{method:"POST",body:JSON.stringify({fn:"scribeSave",args:[a],key:localStorage.getItem("realm_key")||""})}) */}};
var items=STORE.load(),flt=location.hash==="#julie"?"Julie":"Today",cur=null,draft=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function persist(){STORE.save(items);draw()}
function chips(){var v=["Today","All"].concat(ON);document.getElementById("f").innerHTML=v.map(function(o){return'<button class="chip'+(o===flt?" on":"")+'" data-f="'+o+'">'+(o==="Julie"?"Julie view":o)+'</button>'}).join("")}
function attHtml(a){return a.map(function(x){if(x.k==="photo")return'<img class="ph" src="'+esc(x.v)+'" alt="">';if(x.k==="link")return'<a class="att" href="'+esc(x.v)+'" target="_blank" rel="noopener">&#128279; '+esc(x.v.replace(/^https?:\/\//,""))+'</a>';return x.v?'<a class="att" href="'+esc(x.v)+'" download="'+esc(x.n)+'">&#128206; '+esc(x.n)+'</a>':'<span class="att">&#128206; '+esc(x.n)+' (name only, too big)</span>'}).join("")}
function draw(){chips();var a=items.filter(function(i){return flt==="All"||(flt==="Today"?!i.done:i.owner===flt)});
 a.sort(function(x,y){return(x.done-y.done)||((y.urgent?1:0)-(x.urgent?1:0))||(y.ts-x.ts)});
 var op=items.filter(function(i){return!i.done}),ur=op.filter(function(i){return i.urgent}).length,by={};op.forEach(function(i){by[i.owner]=(by[i.owner]||0)+1});
 document.getElementById("day").innerHTML="<b>My day</b> &middot; <b class=u>"+ur+" urgent</b> &middot; "+op.length+" open"+(op.length?" &middot; "+Object.keys(by).map(function(k){return esc(k)+" "+by[k]}).join(", "):"");
 document.getElementById("list").innerHTML=a.length?a.map(function(i){return'<li class="'+(i.done?"d":"")+(i.urgent&&!i.done?" u":"")+'"><button class="tick'+(i.done?" d":"")+'" data-t="'+i.id+'" aria-label="Done">'+(i.done?"&#10003;":"")+'</button><div class="body">'+(i.urgent?'<div class="urg">URGENT</div>':'')+'<div class="t">'+esc(i.title)+'</div>'+(i.note?'<div class="n">'+esc(i.note)+'</div>':"")+'<div class="meta"><span class="ft">'+esc(i.from||"Ange")+' &rarr;</span><button class="own" data-o="'+i.id+'" style="background:'+OWN[i.owner]+'">'+esc(i.owner)+'</button>'+attHtml(i.att||[])+'</div></div><button class="ed" data-e="'+i.id+'" aria-label="Edit">&#8943;</button></li>'}).join(""):'<li class="empty" style="display:block;text-align:left">Nothing here yet. Tap an example to add it, or type above.'+EX.map(function(x){return'<button class="ex" data-ex="'+esc(x)+'">+ '+esc(x)+'</button>'}).join('')+'</li>'}
var EX=["Call back client about anchor test","Julie → Ange: send cert for 93 Pelham","Quote follow-up: Leedwell 24 Riley St","Photo of roof access for next quote"];
function warn(m){var w=document.getElementById("warn");w.textContent=m;w.style.display="block"}
function addItem(v){items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:v,note:"",done:false,from:"Ange",urgent:false,owner:(flt==="All"||flt==="Today")?"Ange":flt,att:[],ts:Date.now()});persist()}
function find(id){return items.filter(function(i){return i.id===id})[0]}
document.getElementById("add").onsubmit=function(e){e.preventDefault();var v=document.getElementById("nt").value.trim();if(!v)return;items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:v,note:"",done:false,from:"Ange",urgent:false,owner:(flt==="All"||flt==="Today")?"Ange":flt,att:[],ts:Date.now()});document.getElementById("nt").value="";persist()};
document.getElementById("f").onclick=function(e){var b=e.target.closest("[data-f]");if(!b)return;flt=b.dataset.f;history.replaceState(null,"",flt==="Julie"?"#julie":location.pathname);draw()};
document.getElementById("list").onclick=function(e){var b=e.target.closest("button");if(!b)return;
 if(b.dataset.ex){addItem(b.dataset.ex)}
 else if(b.dataset.t){var i=find(b.dataset.t);i.done=!i.done;persist()}
 else if(b.dataset.o){var i=find(b.dataset.o);i.owner=ON[(ON.indexOf(i.owner)+1)%ON.length];persist()}
 else if(b.dataset.e)openEd(find(b.dataset.e))};
function drawEd(){document.getElementById("eF").innerHTML=ON.map(function(o){return'<button type="button" data-fr="'+o+'" style="'+((draft.from||"Ange")===o?"background:"+OWN[o]+";color:#fff":"")+'">'+o+'</button>'}).join("");var u=document.getElementById("eU");u.style.background=draft.urgent?"#ff3b30":"";u.style.color=draft.urgent?"#fff":"";u.textContent=draft.urgent?"Urgent \u2713":"Mark urgent";document.getElementById("eO").innerHTML=ON.map(function(o){return'<button type="button" data-w="'+o+'" style="'+(draft.owner===o?"background:"+OWN[o]+";color:#fff":"")+'">'+o+'</button>'}).join("");
 document.getElementById("eA").innerHTML=draft.att.map(function(x,k){return'<div class="atl">'+(x.k==="photo"?'<img class="ph" src="'+esc(x.v)+'" alt="">':"")+'<span>'+esc(x.k==="link"?x.v:x.n||"photo")+'</span><button type="button" data-x="'+k+'">&times;</button></div>'}).join("")}
function openEd(i){cur=i;draft=JSON.parse(JSON.stringify(i));draft.att=draft.att||[];document.getElementById("eT").value=i.title;document.getElementById("eN").value=i.note;drawEd();document.getElementById("sheet").style.display="flex"}
function closeEd(){document.getElementById("sheet").style.display="none";cur=draft=null}
document.getElementById("eO").onclick=function(e){var b=e.target.closest("[data-w]");if(b){draft.owner=b.dataset.w;drawEd()}};
document.getElementById("eF").onclick=function(e){var b=e.target.closest("[data-fr]");if(b){draft.from=b.dataset.fr;drawEd()}};
document.getElementById("eU").onclick=function(){draft.urgent=!draft.urgent;drawEd()};
document.getElementById("start").onclick=function(){flt="Today";history.replaceState(null,"",location.pathname);draw();document.getElementById("list").scrollIntoView({behavior:"smooth"})};
document.getElementById("eA").onclick=function(e){var b=e.target.closest("[data-x]");if(b){draft.att.splice(+b.dataset.x,1);drawEd()}};
document.getElementById("aL").onclick=function(){var u=prompt("Paste link");if(!u)return;u=u.trim();if(!/^https?:\/\//i.test(u))u="https://"+u;draft.att.push({k:"link",v:u});drawEd()};
document.getElementById("aP").onchange=function(){var f=this.files[0];this.value="";if(!f)return;var img=new Image(),r=new FileReader();r.onload=function(){img.onload=function(){var m=1000,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);draft.att.push({k:"photo",v:c.toDataURL("image/jpeg",.7),n:f.name});drawEd()};img.src=r.result};r.readAsDataURL(f)};
document.getElementById("aF").onchange=function(){var f=this.files[0];this.value="";if(!f)return;if(f.size>300000){draft.att.push({k:"file",v:"",n:f.name});drawEd();return}var r=new FileReader();r.onload=function(){draft.att.push({k:"file",v:r.result,n:f.name});drawEd()};r.readAsDataURL(f)};
document.getElementById("eS").onclick=function(){var t=document.getElementById("eT").value.trim();if(!t)return;draft.title=t;draft.note=document.getElementById("eN").value;var k=items.indexOf(cur);items[k]=draft;closeEd();persist()};
document.getElementById("eC").onclick=closeEd;
document.getElementById("sheet").onclick=function(e){if(e.target.id==="sheet")closeEd()};
document.getElementById("eD").onclick=function(){if(!confirm("Delete this item?"))return;items.splice(items.indexOf(cur),1);closeEd();persist()};
if(!STORE.ok)warn("This browser blocks saving (Incognito?). Items stay until you close this tab. Use normal Chrome to keep them.");
draw();
</script><script>/* keep drafts and the open editor when you jump in and out (see js/reconnect.js) */
(function(){if(!window.RealmLine)return;var EK='realm_scribe_edit_v1';RealmLine.drafts(['nt']);
RealmLine.onBack(function(ev){if(ev!=='leave')return;try{if(draft&&cur&&document.getElementById('sheet').style.display==='flex'){var d=JSON.parse(JSON.stringify(draft));d.title=document.getElementById('eT').value;d.note=document.getElementById('eN').value;localStorage.setItem(EK,JSON.stringify({id:cur.id,d:d,t:Date.now()}))}else localStorage.removeItem(EK)}catch(e){}});
try{var sv=JSON.parse(localStorage.getItem(EK)||'null');localStorage.removeItem(EK);if(sv&&Date.now()-sv.t<864e5){var it=find(sv.id);if(it){openEd(it);draft=sv.d;draft.att=draft.att||[];document.getElementById('eT').value=sv.d.title||'';document.getElementById('eN').value=sv.d.note||'';drawEd()}}}catch(e){}
