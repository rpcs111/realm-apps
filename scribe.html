function lsGet(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){$("micMsg").textContent="This browser is not saving (private mode?).";return false}}
var ticks=lsGet(TK,{}),notes=lsGet(NK,[]);if(!Array.isArray(notes))notes=[];
function mk(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function drawTasks(){var U=$("tasks");U.textContent="";$("tsrc").textContent=TSRC;var done=0;
TASKS.forEach(function(t){var tk=ticks[t.id],d=!!(tk&&tk.done);if(d)done++;var li=mk("li",d?"d":"");var b=mk("button","tick"+(d?" d":""),d?"\u2713":"");b.type="button";b.setAttribute("aria-label","Tick "+t.title);b.setAttribute("data-t",t.id);
b.onclick=function(){var cur=ticks[t.id]&&ticks[t.id].done;ticks[t.id]={done:!cur,at:new Date().toISOString()};lsSet(TK,ticks);drawTasks()};
var bd=mk("div","b");bd.appendChild(mk("div","t",t.title));var meta=[];if(t.due)meta.push("Due "+t.due);if(t.scope)meta.push(t.scope);if(t.notes)meta.push(t.notes);meta.push(t.src+" \u00b7 "+t.snap);bd.appendChild(mk("div","n",meta.join("\n")));
li.appendChild(b);li.appendChild(bd);U.appendChild(li)});
$("tcnt").textContent=done+" of "+TASKS.length+" ticked"}
function drawNotes(){var U=$("notes");U.textContent="";var a=notes.slice().sort(function(x,y){return(x.done-y.done)||(y.ts-x.ts)});$("ncnt").textContent=notes.filter(function(n){return!n.done}).length+" open";
if(!a.length){U.appendChild(mk("li","empty","No notes yet. Type below or tap the mic, then Save."));return}
a.forEach(function(n){var li=mk("li",n.done?"d":"");var b=mk("button","tick"+(n.done?" d":""),n.done?"\u2713":"");b.type="button";b.setAttribute("aria-label","Done");b.onclick=function(){n.done=!n.done;lsSet(NK,notes);drawNotes()};
var bd=mk("div","b");bd.appendChild(mk("div","t",n.title||""));var extra=[];if(n.note)extra.push(n.note);if(n.owner&&n.owner!=="Ange")extra.push("For "+n.owner);if(n.ts)extra.push(new Date(n.ts).toLocaleString("en-AU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}));(n.att||[]).forEach(function(x){if(x.k==="link")extra.push(x.v);else if(x.n)extra.push("Attachment: "+x.n)});bd.appendChild(mk("div","n",extra.join("\n")));
var x=mk("button","x","\u00d7");x.type="button";x.setAttribute("aria-label","Delete note");x.onclick=function(){if(!confirm("Delete this note?"))return;notes.splice(notes.indexOf(n),1);lsSet(NK,notes);drawNotes()};
li.appendChild(b);li.appendChild(bd);li.appendChild(x);U.appendChild(li)})}
$("save").onclick=function(){if(listening||rec)micKill();base="";var v=$("nt").value.trim();if(!v){$("micMsg").textContent="Type or say a note first, then Save note.";return}var lines=v.split("\n");notes.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:lines[0].slice(0,140),note:lines.length>1||lines[0].length>140?v:"",done:false,from:"Ange",urgent:false,owner:"Ange",att:[],ts:Date.now()});var okS=lsSet(NK,notes);$("nt").value="";try{$("nt").dispatchEvent(new Event("input",{bubbles:true}))}catch(e){}if(window.RealmLine&&RealmLine.saveDrafts)RealmLine.saveDrafts();drawNotes();if(okS){$("micMsg").textContent="\u2713 Saved \u2013 it's at the top of My notes.";try{$("notes").scrollIntoView({behavior:"smooth",block:"start"})}catch(e){}}};
function csvq(s){s=String(s==null?"":s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
$("exp").onclick=function(){var rows=[["sheet_row","title","due","linked_scope","source","snapshot_status","notes","ticked_here","ticked_at"]];TASKS.forEach(function(t){var tk=ticks[t.id]||{};rows.push([t.row,t.title,t.due,t.scope,t.src,t.snap,t.notes,tk.done?"yes":"no",tk.at||""])});
var csv="\ufeff"+rows.map(function(r){return r.map(csvq).join(",")}).join("\r\n");var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="realm_tasks_ticks_"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove()};
/* mic (Ara, 15 Oct): dictation into the note box. Short sessions that restart themselves until you tap Stop
   (avoids Android Chrome's repeated-words bug with continuous mode). Only resumes after leaving the app if it was on. */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null,listening=false,want=false,base="",sess="",misses=0,heardAny=false,micErrShown=false;
var MICERR={"not-allowed":"Mic is blocked. Tap the lock/settings icon left of the address, allow Microphone, then tap Mic again.","service-not-allowed":"Mic is blocked. Tap the lock/settings icon left of the address, allow Microphone, then tap Mic again.","audio-capture":"No microphone found on this device.","network":"Voice needs internet. Check signal and tap Mic again.","language-not-supported":"Voice isn't available for English (Australia) here. Use the keyboard mic."};
function RLx(){return window.RealmLine||null}
function micUI(on){listening=on;$("mic").classList.toggle("on",on);$("mic").setAttribute("aria-pressed",on?"true":"false");$("mic").querySelector(".ml").textContent=on?"Stop":"Mic"}
function micKill(){want=false;if(rec){var r=rec;rec=null;r.onresult=r.onend=r.onerror=null;try{r.abort()}catch(e){}}micUI(false);base="";sess="";var R=RLx();if(R&&R.micStop)R.micStop("notes")}
function micSession(){var r=new SR();rec=r;r.lang="en-AU";r.interimResults=true;r.continuous=false;r.maxAlternatives=1;sess="";var heard=false;
r.onresult=function(e){if(rec!==r)return;var t="";for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;sess=t.trim();if(sess){heard=true;heardAny=true}$("nt").value=base+sess};
r.onerror=function(e){var c=e.error||"error";if(c==="no-speech"||c==="aborted")return;want=false;micErrShown=true;$("micMsg").textContent=MICERR[c]||("Mic: "+c+". Tap Mic to try again.")};
r.onend=function(){if(rec!==r)return;rec=null;if(sess){base+=sess+" ";sess=""}$("nt").value=base.replace(/\s+$/,"");misses=heard?0:misses+1;
 if(document.hidden){micUI(false);want=false;var R0=RLx();if(R0&&R0.micEnd)R0.micEnd("notes");return}
 if(want&&misses<2){try{micSession();r=null;rec.start();return}catch(err){}}
 want=false;micUI(false);base="";var R=RLx();if(R&&R.micStop)R.micStop("notes");
 if(!micErrShown)$("micMsg").textContent=heardAny?"Got it. Check the words, then tap Save note.":"Didn't hear anything. Tap Mic and talk."};
return r}
function startMic(){if(!SR){$("micMsg").textContent="Voice typing is not available in this browser. Use the mic on your keyboard.";return}
if(listening)return;try{base=$("nt").value?$("nt").value.replace(/\s*$/," "):"";want=true;misses=0;heardAny=false;micErrShown=false;micSession().start();micUI(true);$("micMsg").textContent="Listening\u2026 talk, then tap Stop.";var R=RLx();if(R){if(R.mic)R.mic("notes",startMic);if(R.micLive)R.micLive("notes")}}catch(err){micKill();$("micMsg").textContent="Mic could not start: "+err}}
$("mic").onclick=function(){if(listening){want=false;if(rec){try{rec.stop()}catch(e){micKill()}}else micKill()}else startMic()};
if(window.RealmLine){RealmLine.drafts(["nt"]);RealmLine.onBack(function(){ticks=lsGet(TK,{});notes=lsGet(NK,[]);if(!Array.isArray(notes))notes=[];drawTasks();drawNotes()})}
