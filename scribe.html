.b{flex:1;min-width:0}.t{font-weight:600;overflow-wrap:anywhere}.d .t{text-decoration:line-through;color:#8f9bb8}

.row a,.row button{flex:1 1 auto;text-align:center;border:1px solid rgba(0,229,255,.35);background:#0f1830;color:#e8eefc;border-radius:12px;padding:10px;font:600 14px inherit;text-decoration:none;min-height:44px}
.cnt{font-size:13px;color:#8f9bb8}.empty{color:#8f9bb8;padding:12px 2px}
</style></head><body><div class="wrap">

</div>
<h2>Tasks <span class="cnt" id="tcnt"></span></h2>

<h2>My notes <span class="cnt" id="ncnt"></span></h2>

</div>
<script src="js/reconnect.js"></script>
<script>
"use strict";

SNAPSHOT 17 Sep \u2014 live status unknown", "scope": "Anchor certification \u2014 re cert", "src": "JP to do (via 'JP TO DO \u2014 cert checks (mirror)' sheet, 17 Sep)", "link": "https://tasks.google.com/", "notes": "Cert SENT 17 Sep; invoice NO (raise from EST-7042 $495)"}, {"id": "ov8", "row": 8, "title": "CHECK CERT \u00b7 5 Davidson St South Yarra \u2014 31.7.26", "due": "", "snap": "SNAPSHOT 17 Sep \u2014 live status unknown", "scope": "Anchor certification \u2014 re cert", "src": "JP to do (via 'JP TO DO \u2014 cert checks (mirror)' sheet, 17 Sep)", "link": "https://tasks.google.com/", "notes": "Cert SENT 17 Sep; INV-8139 $1595 PAID 13 Aug"}, {"id": "ov9", "row": 9, "title": "Ring Shannons 13 46 46 \u2014 X3 agreed value dispute", "due": "2026-10-06 08:00", "snap": "SNAPSHOT 5 Oct \u2014 live status unknown", "scope": "(personal)", "src": "Ange to do (logged in REALM OPEN REGISTER CHANGELOG, 5 Oct)", "link": "https://tasks.google.com/", "notes": "Created 5 Oct per register log row 109"}, {"id": "ov10", "row": 10, "title": "MOVE WHATSAPP BUSINESS off the S26", "due": "~2026-10-20", "snap": "SNAPSHOT 9 Oct \u2014 live status unknown", "scope": "(none / admin)", "src": "Ange to do (H-0017 handover, 9 Oct)", "link": "https://tasks.google.com/", "notes": "Phone changeover; phone return due about 20 Oct"}];
var TSRC="Source: GOOGLE TASKS OVERLAY sheet in Drive (read 15 Oct 2026). These "+TASKS.length+" rows are snapshots from 17 Sep, 5 Oct and 9 Oct, not a live pull from Google Tasks, so some may already be done. Ticks here stay on this phone; use Export so Ara can check them against the system.";
var TK="realm_notes_tasks_v1",NK="realm_scribe_v1";
function $(i){return document.getElementById(i)}
function lsGet(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){$("micMsg").textContent="This browser is not saving (private mode?).";return false}}
var ticks=lsGet(TK,{}),notes=lsGet(NK,[]);if(!Array.isArray(notes))notes=[];
function mk(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function drawTasks(){var U=$("tasks");U.textContent="";$("tsrc").textContent=TSRC;var done=0;
TASKS.forEach(function(t){var tk=ticks[t.id],d=!!(tk&&tk.done);if(d)done++;var li=mk("li",d?"d":"");var b=mk("button","tick"+(d?" d":""),d?"\u2713":"");b.type="button";b.setAttribute("aria-label","Tick "+t.title);b.setAttribute("data-t",t.id);
b.onclick=function(){var cur=ticks[t.id]&&ticks[t.id].done;ticks[t.id]={done:!cur,at:new Date().toISOString()};lsSet(TK,ticks);drawTasks()};
var bd=mk("div","b");bd.appendChild(mk("div","t",t.title));var meta=[];if(t.due)meta.push("Due "+t.due);if(t.scope)meta.push(t.scope);if(t.notes)meta.push(t.notes);meta.push(t.src+" \u00b7 "+t.snap);bd.appendChild(mk("div","n",meta.join("\n")));
li.appendChild(b);li.appendChild(bd);U.appendChild(li)});
$("tcnt").textContent=done+" of "+TASKS.length+" ticked"}
function drawNotes(){var U=$("notes");U.textContent="";var a=notes.slice().sort(function(x,y){return(x.done-y.done)||(y.ts-x.ts)});$("ncnt").textContent=notes.filter(function(n){return!n.done}).length+" open";
if(!a.length){U.appendChild(mk("li","empty","No notes yet. Type or tap Mic above, then Save note."));return}
a.forEach(function(n){var li=mk("li",n.done?"d":"");var b=mk("button","tick"+(n.done?" d":""),n.done?"\u2713":"");b.type="button";b.setAttribute("aria-label","Done");b.onclick=function(){n.done=!n.done;lsSet(NK,notes);drawNotes()};
var bd=mk("div","b");bd.appendChild(mk("div","t",n.title||""));var extra=[];if(n.note)extra.push(n.note);if(n.owner&&n.owner!=="Ange")extra.push("For "+n.owner);if(n.ts)extra.push(new Date(n.ts).toLocaleString("en-AU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}));(n.att||[]).forEach(function(x){if(x.k==="link")extra.push(x.v);else if(x.n)extra.push("Attachment: "+x.n)});bd.appendChild(mk("div","n",extra.join("\n")));
var x=mk("button","x","\u00d7");x.type="button";x.setAttribute("aria-label","Delete note");x.onclick=function(){if(!confirm("Delete this note?"))return;notes.splice(notes.indexOf(n),1);lsSet(NK,notes);drawNotes()};
li.appendChild(b);li.appendChild(bd);li.appendChild(x);U.appendChild(li)})}
$("save").onclick=function(){var v=$("nt").value.trim();if(!v)return;var lines=v.split("\n");notes.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:lines[0].slice(0,140),note:lines.length>1||lines[0].length>140?v:"",done:false,from:"Ange",urgent:false,owner:"Ange",att:[],ts:Date.now()});lsSet(NK,notes);$("nt").value="";drawNotes()};
function csvq(s){s=String(s==null?"":s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
$("exp").onclick=function(){var rows=[["sheet_row","title","due","linked_scope","source","snapshot_status","notes","ticked_here","ticked_at"]];TASKS.forEach(function(t){var tk=ticks[t.id]||{};rows.push([t.row,t.title,t.due,t.scope,t.src,t.snap,t.notes,tk.done?"yes":"no",tk.at||""])});
var csv="\ufeff"+rows.map(function(r){return r.map(csvq).join(",")}).join("\r\n");var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="realm_tasks_ticks_"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove()};
/* mic: dictation into the note box */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null,listening=false,base="";
function micUI(on){listening=on;$("mic").classList.toggle("on",on);$("mic").textContent=on?"\u25a0 Stop":"\ud83c\udfa4 Mic"}
function startMic(){if(!SR){$("micMsg").textContent="Voice typing is not available in this browser. Use the mic on your keyboard.";return}
try{rec=new SR();rec.lang="en-AU";rec.interimResults=true;rec.continuous=true;base=$("nt").value?$("nt").value.replace(/\s*$/," "):"";
rec.onresult=function(e){var fin="",tmp="";for(var i=e.resultIndex;i<e.results.length;i++){var r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else tmp+=r[0].transcript}if(fin){base+=fin.trim()+" "}$("nt").value=base+tmp};
rec.onerror=function(e){$("micMsg").textContent="Mic: "+(e.error||"error")+". Tap Mic to try again."};
rec.onend=function(){micUI(false);$("nt").value=$("nt").value.trim();if(window.RealmLine&&RealmLine.micEnd)RealmLine.micEnd("notes")};
rec.start();micUI(true);$("micMsg").textContent="Listening\u2026 tap Stop when done.";if(window.RealmLine&&RealmLine.micLive)RealmLine.micLive("notes")}catch(err){micUI(false);$("micMsg").textContent="Mic could not start: "+err}}
$("mic").onclick=function(){if(listening){try{rec.stop()}catch(e){}if(window.RealmLine&&RealmLine.micStop)RealmLine.micStop("notes");micUI(false);$("micMsg").textContent="Stopped."}else startMic()};
if(window.RealmLine){RealmLine.drafts(["nt"]);if(RealmLine.mic)RealmLine.mic("notes",startMic);RealmLine.onBack(function(){ticks=lsGet(TK,{});notes=lsGet(NK,[]);if(!Array.isArray(notes))notes=[];drawTasks();drawNotes()})}
drawTasks();drawNotes();
