  }
  function say(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    var btn=document.getElementById('sayJob');
    if(!SR){note('Say the job needs the mic in this browser. Type the address in search instead.');return}
    var rec=new SR();rec.lang='en-AU';rec.interimResults=false;rec.maxAlternatives=1;
    btn.classList.add('on');btn.textContent='Listening…';
    rec.onresult=function(e){
      var said=(e.results[0]&&e.results[0][0]&&e.results[0][0].transcript)||'';
      heard=said;
      var best=null,score=0;
      rows.forEach(function(c){var n=scoreCert(said,c);if(n>score){score=n;best=c}});
      if(!best||score<2){filterId='';note('No cert matched “‘'+said+'”.');render();return}
      var info=whenOf(best);
      if(info)wkShift=shiftFor(info.key);
      filterId=idOf(best);
      note('Heard: '+said);
      render();
    };
    rec.onerror=function(){note('Didn\'t catch that. Tap Say the job and try again.')};
    rec.onend=function(){btn.classList.remove('on');btn.textContent='Say the job'};
    try{rec.start()}catch(e){btn.classList.remove('on');btn.textContent='Say the job';note('Didn\'t catch that. Tap Say the job and try again.')}
  }
  document.getElementById('wkPrev').onclick=function(){wkShift--;render()};
  document.getElementById('wkNext').onclick=function(){wkShift++;render()};
  document.getElementById('showAll').onclick=function(){filterId='';heard='';note('');render()};
  document.getElementById('sayJob').onclick=say;
  renderPath();
  render();
  load();
  window.__certWeeks={parseStart:parseStart,whenOf:whenOf,cardHtml:cardHtml,incorrect:incorrect,mondayKey:mondayKey,scoreCert:scoreCert,addDaysKey:addDaysKey,shiftMatch:shiftMatch,deputyLabel:deputyLabel};
})();
</script>
</body></html>
