<style>/* HUB: four apps (Search Studio, Note, Desk, Deck). Flow lives in More. History and Flow Map shelves sit above More. */
:root{--accent:#22d3ee}
*{box-sizing:border-box}html,body{overflow-x:hidden;max-width:100%}
html,body.hub{background:#000!important;background-image:none!important;background-color:#000!important}
body.hub{margin:0;min-height:100dvh;color:#e5e5e5;font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding:0 0 calc(110px + env(safe-area-inset-bottom))}
.hub-top{padding-top:env(safe-area-inset-top);background:#000!important}
.hub-top h1.rui-title{margin:0;font-size:15px;letter-spacing:.06em;color:#fff}
.hub-mark{width:28px;height:28px;flex:0 0 28px;background:url(pwa/hub-star.svg?v=20261026-1) center/contain no-repeat}
.shell{display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding:10px 12px;min-width:0}
.side,.main{min-width:0}
.ver{display:none}
#q{display:block;width:100%;max-width:100%;min-height:44px;margin:0 0 10px;padding:0 14px;border-radius:12px;border:1px solid var(--accent);background:#0a0a0a;color:#fff;font:16px/1.2 system-ui,-apple-system,Roboto,sans-serif}
#q:focus{outline:2px solid var(--accent);outline-offset:2px}
.who{display:flex;gap:8px;margin:0 0 12px}
.who button{flex:1 1 0;min-height:44px;min-width:44px;padding:0 12px;border-radius:12px;border:1px solid #333;background:#0a0a0a;color:#d4d4d4;font:600 15px/1 system-ui,-apple-system,Roboto,sans-serif;cursor:pointer}
.who button.on{border-color:var(--accent);background:var(--accent);color:#000}
.four{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#four[hidden]{display:none!important}
.four a,.hits a,.more a{display:flex;flex-direction:column;justify-content:center;text-decoration:none;color:#fff;background:#0a0a0a;border:1px solid #262626;min-width:0;max-width:100%}
.four a{min-height:112px;padding:14px;border-radius:16px;border-color:var(--accent)}
.four a b,.hits a b{letter-spacing:.04em;overflow-wrap:anywhere}
.four a b{font-size:16px}.four a span,.hits a span{color:#a3a3a3;font-size:13px;margin-top:4px;overflow-wrap:anywhere}
.four a:focus-visible,.hits a:focus-visible,.more a:focus-visible,.who button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hits[hidden]{display:none}
.hits a{min-height:44px;padding:10px 12px;margin:0 0 8px;border-radius:12px;border-color:var(--accent)}
.hits a b{font-size:15px}
.none{color:#a3a3a3;font-size:14px;margin:8px 2px}
details.more{margin-top:14px;border:1px solid #262626;border-radius:16px;background:#050505}
details.more summary{list-style:none;cursor:pointer;min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:700;letter-spacing:.08em;color:#fff}
details.more summary::-webkit-details-marker{display:none}
details.more summary i{font-style:normal;color:#a3a3a3;font-weight:400;font-size:13px;letter-spacing:0}
details.more[open] summary{border-bottom:1px solid #1f1f1f}
details.more:not([open]) > .mgrid{display:none}
details.more[open] > .mgrid,.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;padding:10px}
.more a{min-height:56px;padding:8px 12px;border-radius:12px}
.more a b{font-size:13.5px;letter-spacing:.03em;overflow-wrap:anywhere}.more a span{color:#a3a3a3;font-size:11.5px;overflow-wrap:anywhere}
.more a:hover,.more a:focus-visible{border-color:var(--accent)}
/* Shelves (29 Oct 2026): History (what the bots did) and Flow Map */
.shelf{margin:0 0 14px;border:1px solid #262626;border-radius:16px;background:#050505;padding:12px 12px 10px;min-width:0;max-width:100%}
.shelf h2{margin:0 0 6px;font-size:14px;letter-spacing:.08em;color:#fff}
.shelf .why{margin:6px 0 4px;color:#fcd34d;font-size:14px;overflow-wrap:anywhere}
.shelf .why[hidden]{display:none}
.hh-count{margin:0 0 8px;color:#a3a3a3;font-size:12.5px;overflow-wrap:anywhere}
.hh-list{list-style:none;margin:0;padding:0}
.hh-row{border-top:1px solid #1a1a1a;padding:8px 2px;min-width:0}
.hh-row:first-child{border-top:0}
.hh-top{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;font-size:12.5px}
.hh-who{color:var(--accent);font-weight:700}.hh-role{color:#d4d4d4}.hh-time{color:#8a8a8a;margin-left:auto}
.hh-what{color:#fff;font-size:14.5px;margin-top:2px;overflow-wrap:anywhere}
.hh-res{color:#a3a3a3;font-size:13px;margin-top:2px;overflow-wrap:anywhere}.hh-res b{color:#d4d4d4;font-weight:600}
.shelf-btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;max-width:100%;padding:0 16px;margin-top:6px;border-radius:12px;border:1px solid var(--accent);background:#0a0a0a;color:#fff;font:600 15px/1.2 system-ui,-apple-system,Roboto,sans-serif;text-decoration:none;cursor:pointer}
.shelf-btn[hidden]{display:none}
.shelf-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.shelf-btn[disabled]{border-color:#404040;color:#8a8a8a;cursor:not-allowed}
@media(max-width:360px){.four a b{font-size:15px}}
@media(min-width:900px){
 body.hub{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
 .shell{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);max-width:1180px;gap:0;padding:0;align-items:start}
 .side{position:sticky;top:calc(var(--rui-top,48px) + env(safe-area-inset-top));align-self:start;padding:14px 14px 24px;border-right:1px solid #1f1f1f;max-height:calc(100dvh - var(--rui-top,48px));overflow:auto}
 .main{padding:14px 16px 40px}
}
</style>

<script>
/* DESK on Pages (desk-pages.html) is the Desk; it never leaves rpcs111.github.io. */
var FOUR=[
 {name:"SEARCH STUDIO",sub:"Search · amend notes",u:"./search.html"},
 {name:"NOTE",sub:"Pick up where you left off · to-dos",u:"./notes.html"},
 {name:"DESK",sub:"Job board",u:"./desk-pages.html"},
 {name:"DECK",sub:"History · what changed",u:"./deck.html"}];
var MORE=[
 {name:"FLOW",sub:"Programs + bridges",u:"./metatron3.html"},
 {name:"FLOW MAP",sub:"Tap a step · add a note",u:"./map.html"},
 {name:"QUEUE",sub:"Layer 1 board",u:"./queue.html"},
 {name:"REALM MAP",sub:"Edit in place",u:"./mapper.html"},
 {name:"LAYERS",sub:"The build, layer by layer",u:"./layers.html"},
 {name:"ETA",sub:"What's running",u:"./eta.html"},
 {name:"PRIVATE",sub:"locked",u:"./private.html"},
 {name:"MEET RECORDINGS",sub:"Google Sheet",u:"https://docs.google.com/spreadsheets/d/13QpygblRPrGIM7a6PLzt4THo18yLhx21kjuWqc63Zks/edit",ext:true},
 {name:"GROK HOW-TO",sub:"How to use it",u:"./grok-howto.html"},
 {name:"VIDEO",sub:"YouTube search",u:"./video.html"},
 {name:"FINDINGS",sub:"What changed",u:"./findings.html"},
 {name:"TEAM",sub:"Who does what",u:"./team.html"},
 {name:"CAPTURE",sub:"Quick capture",u:"./capture.html"},
 {name:"CERT STUDIO",sub:"Anchor certs",u:"./certstudio.html"},
 {name:"REGISTER",sub:"REALM OPEN REGISTER sheet",u:"https://docs.google.com/spreadsheets/d/1REJWxu7oD3MY9z7TCPsv-OznnPTu1lAHsONMlU8refM/edit",ext:true},
 {name:"PHONE GEAR",sub:"Phone kit doc",u:"https://docs.google.com/document/d/1z9FHDyTNk-vjCIQcMi_NaSBlJJ-ao_lyR1_UhaCRjY0/edit",ext:true}];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tile(x){var t=(x.ext||HUB_SA)?"_blank":"_self",r=x.ext?"noopener noreferrer":"noopener";return '<a href="'+esc(x.u)+'" target="'+t+'" rel="'+r+'"><b>'+esc(x.name)+'</b><span>'+esc(x.sub)+'</span></a>'}
document.getElementById("four").innerHTML=FOUR.map(tile).join("");
document.getElementById("mgrid").innerHTML=MORE.map(tile).join("");
document.getElementById("mcnt").textContent=MORE.length+" apps";
function norm(s){return String(s||"").toLowerCase()}
function matches(q){q=norm(q).trim();if(!q)return [];return FOUR.concat(MORE).filter(function(x){return norm(x.name).indexOf(q)>=0||norm(x.sub).indexOf(q)>=0})}
function renderHits(q){var box=document.getElementById("hits"),four=document.getElementById("four"),list=matches(q);
 if(!norm(q).trim()){box.hidden=true;box.innerHTML="";four.hidden=false;return}
 four.hidden=true;box.hidden=false;
 box.innerHTML=list.length?list.map(tile).join(""):'<p class="none">No app matches</p>'}
var qEl=document.getElementById("q");
qEl.addEventListener("input",function(){renderHits(qEl.value)});
qEl.addEventListener("keydown",function(e){if(e.key!=="Enter")return;var list=matches(qEl.value);if(!list.length)return;e.preventDefault();var a=document.querySelector("#hits a");if(a)a.click()});
function accentFor(u){return u==="julie"?"#ff4fa3":"#22d3ee"}
function applyUser(u,save){if(u!=="julie")u="ange";document.documentElement.style.setProperty("--accent",accentFor(u));
 var btns=document.querySelectorAll(".who button");
 for(var i=0;i<btns.length;i++){var on=btns[i].getAttribute("data-who")===u;btns[i].classList.toggle("on",on);btns[i].setAttribute("aria-pressed",on?"true":"false")}
 if(save){try{localStorage.setItem("realm_user",u)}catch(e){}}}
var startUser="ange";try{startUser=localStorage.getItem("realm_user")||"ange"}catch(e){}
applyUser(startUser,false);
var whoBtns=document.querySelectorAll(".who button");
for(var wi=0;wi<whoBtns.length;wi++)whoBtns[wi].addEventListener("click",function(){applyUser(this.getAttribute("data-who"),true)});
/* More folder remembers open/closed on this device */
(function(){var d=document.getElementById("more"),K="hub_more_open";try{if(localStorage.getItem(K)==="1")d.open=true}catch(e){}d.addEventListener("toggle",function(){try{localStorage.setItem(K,d.open?"1":"0")}catch(e){}})})();
/* Version line comes from version.json, so it is always the live one */
fetch("version.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){if(j&&j.v)document.getElementById("ver").textContent="Version "+j.v}).catch(function(){});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js?v=20261016v5",{updateViaCache:"none"});
</script>
