<script>
var EXEC="https://script.google.com/macros/s/AKfycbxhGb1O-6S6C2PJS92EEuViEBDu0wj2AGTzgkGtm_7MixmXsepE-XxF9rgly0f6SwARGw/exec";
var COLORS=["#2563eb","#16a34a","#dc2626","#9333ea","#ea580c","#0891b2","#db2777","#4f46e5","#65a30d","#b45309"];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fix(name,url){var n=name.toUpperCase();
 if(/REALM DESK/.test(n))return "./desk.html";
 if(/CERT STUDIO/.test(n))return "https://script.google.com/macros/s/AKfycbwFil-RiQujoffiDoBnGk6YvjLuyr1vaqCQKVUPtWT9NmGVQryPcwEsjIlieL93Yps/exec";
 if(/SCRIBE/.test(n))return "./scribe.html";
 return url}
var BAD=/orion|elon|grok|claude/i;
(window.RealmLine?RealmLine.fetch:fetch)(EXEC,{method:"POST",redirect:"follow",credentials:"omit",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:"getLinks",args:[],key:(function(){try{return localStorage.getItem("realm_key")||""}catch(e){return""}})()})})
.then(function(r){return r.json()}).then(function(j){
 if(!j||!j.ok)throw new Error((j&&j.error)||"getLinks failed");
 var seen={},t=(j.result||[]).filter(function(x){var k=String(x.title)+" "+String(x.url);
   if(!/^\s*\u2605/.test(String(x.title))||/orion/i.test(k)||seen[x.title])return false;seen[x.title]=1;return true});
 var g=document.getElementById("grid");
 if(!t.length){g.innerHTML='<div class="err">No tiles found in REALM_LINKS.</div>';return}
 t=t.map(function(x){var s=String(x.title).replace(/^\s*\u2605\s*/,"").split(/\s+\u2014\s+/);var name=s[0],sub=s[1]||"",badge="";if(BAD.test(sub))sub="";
   var u=fix(name,x.url);
   if(/^REALM DESK/i.test(name))name="REALM DESK";
   if(/^NOVA$/i.test(name)){u="https://gemini.google.com/gem/aa2550627d15";sub="Gemini"}
   if(/^(STATUS|QUOTES TONIGHT)$/i.test(name))badge="old app";
   if(/docs\.google\.com/.test(u))badge="needs sign-in";
   return {name:name,sub:sub,u:u,badge:badge,reg:/regist/i.test(name+" "+sub)}});
 t.push({name:"ARA",sub:"Chat",u:"https://grok.com/",badge:"",reg:false});
 t.push({name:"REALM SEARCH STUDIO",sub:"Register · Calendar · Drive",u:"./search.html",badge:"",reg:false,c:"#16a34a"});
 t.push({name:"VIDEO SEARCH",sub:"YouTube",u:"./video.html",badge:"",reg:false});
 t.push({name:"FINDINGS",sub:"What changed",u:"./findings.html",badge:"",reg:false});
 t.push({name:"TEAM",sub:"Ara + coworkers",u:"./team.html",badge:"",reg:false});
 t.push({name:"REALM MAPPER",sub:"Live paste",u:"./mapper.html",badge:"",reg:false});
 t=t.filter(function(x){return !/FLOW MAP|^STATUS$|REALM LAUNCHER|DESK V3/i.test(x.name)});
 t.sort(function(a,b){return (b.reg?1:0)-(a.reg?1:0)});
 var fi=-1;t.forEach(function(x,k){if(/^FLOW MAP$/i.test(x.name))fi=k});t.splice(fi>=0?fi+1:t.length,0,{name:"REALM FLOW MAP",sub:"24 Sep original",u:"https://script.google.com/macros/s/AKfycbyraSxweXHy2Io-vI4rJ9pGskyKzIedY1PdtYPYtybupFfovZsoP7ROLWEvdAnZIcs/exec",badge:"",reg:false});
 var si=-1;t.forEach(function(x,k){if(/^SCRIBE/i.test(x.name))si=k});var sc=si>=0?t.splice(si,1)[0]:{};sc.name="SCRIBE";sc.sub="You Got Me Bro";sc.u="./scribe.html";sc.badge="";sc.reg=true;t.unshift(sc);
 g.innerHTML=t.map(function(x,i){
   return '<a href="'+esc(x.u)+'" target="_self" class="'+(x.reg?'reg':'')+'" style="background:'+(x.reg?'#047857':(x.c||COLORS[i%COLORS.length]))+'">'+(x.badge?'<i>'+esc(x.badge)+'</i>':'')+'<b>'+esc(x.name)+'</b><span>'+esc(x.sub)+'</span></a>'}).join("");
}).catch(function(e){document.getElementById("grid").innerHTML='<div class="err">Could not load tiles: '+esc(e.message)+'</div>'});
var dp=null,btn=document.getElementById("install"),help=document.getElementById("help");
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e});
btn.onclick=function(){if(dp){dp.prompt();dp.userChoice.then(function(){dp=null})}else{help.style.display="block"}};
window.addEventListener("appinstalled",function(){btn.textContent="Saved as app \u2713"});
if(window.matchMedia("(display-mode: standalone)").matches)btn.style.display="none";
if(navigator.standalone)btn.style.display="none";
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script><script>/* bot line reconnect hooks (see js/reconnect.js) */
(function(){if(!window.RealmLine)return;RealmLine.line({name:'Desk v9 (tiles)',ping:function(){return RealmLine.pingExec(EXEC)},onUp:function(){if(document.querySelector('#grid .err'))location.reload()}});})();</script><script src="voice.js"></script>
<script src="js/saveapp.js" data-hide="#install,#help"></script></body></html>
