*{box-sizing:border-box}html,body{overflow-x:hidden}body{min-height:100dvh;padding-bottom:calc(40px + env(safe-area-inset-bottom));padding-top:calc(20px + env(safe-area-inset-top));margin:0;background:#fff;color:#111827;font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding:20px 16px 40px}
h1{margin:0 0 4px;font-size:26px;letter-spacing:.04em}.sub{color:#6b7280;font-size:14px;margin-bottom:16px}
#install{display:block;width:100%;padding:16px;border:0;border-radius:14px;background:#111827;color:#fff;font:700 17px sans-serif;margin-bottom:12px}
#help{display:none;background:#f3f4f6;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px}
#st{display:block;padding:16px;border-radius:18px;background:#111827;color:#fff;text-decoration:none;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.12)}#st b{font-size:20px;display:block}#st span{font-size:13px;opacity:.85}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
#grid a{display:flex;flex-direction:column;justify-content:flex-end;min-height:118px;padding:14px;border-radius:18px;color:#fff;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#grid a{position:relative}#grid a.reg{grid-column:1/-1;min-height:130px}#grid a.reg b{font-size:24px}#grid a i{position:absolute;top:10px;right:10px;font-style:normal;font-size:11px;font-weight:700;background:rgba(255,255,255,.9);color:#111827;padding:2px 7px;border-radius:999px}#grid a b{font-size:18px;overflow-wrap:anywhere}@media(max-width:380px){body{padding-left:10px;padding-right:10px}#grid{gap:8px}#grid a{min-height:100px;padding:11px}#grid a b{font-size:16px}}#grid a span{font-size:13px;opacity:.9}
.err{grid-column:1/-1;background:#fee2e2;color:#991b1b;padding:14px;border-radius:12px}.load{grid-column:1/-1;color:#6b7280}
</style><style>/* Ara theme for the launcher (16 Oct) */body{color:var(--ara-ink)}.sub,.load{color:var(--ara-mute)}h1{color:#fff}#st{background:var(--ara-card);border:1px solid var(--ara-line);box-shadow:none}#grid a{background:linear-gradient(160deg,#0d3a4e 0%,#071b29 100%)!important;border:1px solid var(--ara-line);box-shadow:0 0 0 1px rgba(0,0,0,.2)}#grid a:hover,#grid a:focus-visible{border-color:var(--ara-accent)}#grid a.reg{background:linear-gradient(160deg,#0f5566 0%,#06222f 100%)!important}#grid a b{color:#fff}#grid a span{color:#cfe9f1;opacity:1}#grid a i{background:var(--ara-accent);color:#02060c}.err{background:#3a1010;color:#fecaca;border:1px solid #7f1d1d}</style>
