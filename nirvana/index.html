<style>
:root{--bg:#0a0a0a;--ink:#f4f1ea;--muted:#b7b1a8;--ara:#00aeef;--marvin:#e0262f;--gold:#d4af37;--falcon:#5b6b7f;--falcon-stroke:#c9d3df;--violet:#9b6dff;--nova:#a39e93;--nova-stroke:#c4bfb4;--lead:#2fb5e8;--desk:#2bb8d6;--cert:#2fbf9a;--line:#2c2c2c}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:#0a0a0a;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.2px);background-size:18px 18px}
button,a.tap{font:inherit;color:inherit;cursor:pointer}
button,.tap,.tile{min-width:44px;min-height:44px}
a.tap{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px}
.top{height:48px;max-height:48px;display:flex;align-items:center;gap:8px;padding:0 8px;background:rgba(10,10,10,.94);border-bottom:1px solid var(--line);flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
.mark{width:28px;height:28px;flex:none;display:block}
.word{font-weight:800;letter-spacing:.14em;font-size:15px}
#nvDev{color:var(--muted);font-size:12px;font-weight:700}
.top .acts{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.top .tap{height:44px;min-height:44px;min-width:44px;padding:0 12px;border-radius:999px;border:1px solid var(--ara);background:transparent;color:var(--ara);font-weight:700}
.stamp{margin:0;padding:8px 12px 0;color:var(--muted);font-size:13px;font-weight:700}
.lock{min-height:calc(100vh - 48px);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(420px,100%);text-align:center}
.card h1{margin:8px 0 4px;letter-spacing:.16em;font-size:22px}
.card p{color:var(--muted);margin:0 0 12px}
.krow{display:flex;gap:8px}
.krow input{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#141414;color:var(--ink);padding:0 12px;font-size:17px}
#kEye,#b,#nvInstall,.x,.tap{border-radius:12px;border:1px solid var(--line);background:#161616;color:var(--ink);padding:0 14px;font-weight:700}
#b{width:100%;margin-top:8px;background:var(--ara);color:#041018;border:0}
#gxWait{color:var(--ara);font-weight:700}
.err{color:#ff8d8d;min-height:20px;margin:8px 0}
.board{padding:8px 12px 32px;max-width:1100px;margin:0 auto}
.tiles{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.tiles{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.tiles{grid-template-columns:repeat(5,1fr)}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px;border-radius:16px;border:1px solid var(--line);background:#121212;width:100%}
.tile b{font-size:18px}.tile span{color:var(--muted);font-size:14px}
.slot{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.6px solid currentColor}
.slot svg{width:26px;height:26px}
.ara{color:var(--ara)}.marvin{color:var(--marvin)}.gold{color:var(--gold)}.falcon{color:var(--falcon-stroke)}.falcon .slot{background:var(--falcon);border-color:var(--falcon)}
.violet{color:var(--violet)}.nova{color:var(--nova-stroke)}.nova .slot{background:var(--nova);border-color:var(--nova)}
.lead{color:var(--lead)}.desk{color:var(--desk)}.cert{color:var(--cert)}
.more{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.sheet-card{width:min(640px,100%);max-height:min(92vh,900px);overflow:auto;background:#101010;border:1px solid var(--line);border-radius:18px;padding:14px 14px 20px}
.sheet-card h2{margin:0 0 6px;font-size:22px}
.sheet-card p{margin:8px 0}
.why{color:var(--muted)}
.without{color:var(--gold);font-weight:700}
.status{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.x{margin-bottom:8px}
.steps{margin:8px 0;padding-left:22px}
.steps li{margin:8px 0}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.orb{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:6px;text-align:center;font-size:12px;font-weight:800;line-height:1.15}
.gate-row,.orbit{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin:10px 0}
.ange{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px dashed var(--muted);color:var(--muted);font-weight:800}
.person{display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:220px}
#nvWin{position:fixed;inset:0;z-index:80;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#nvWin canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#nvWin p{position:relative;z-index:1;font:600 22px/1.35 system-ui;max-width:18em}
#nvWin button{position:relative;z-index:1}
.toast{position:fixed;z-index:90;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;border-radius:999px;padding:12px 16px;font-weight:700;min-height:44px;display:flex;align-items:center}
#nvMapToast{position:static;left:auto;right:auto;top:auto;bottom:auto;transform:none;margin:10px 0 0;z-index:1;max-width:100%}
</style>

<body>
<header class="top">
<svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#00aeef" stroke-width="2.2" stroke-linejoin="round"><path transform="rotate(0 32 32)" d="M32 22.5C28.6 17.6 29 11 32 5.5C35 11 35.4 17.6 32 22.5Z"/><path transform="rotate(40 32 32)" d="M32 22.5C28.6 17.6 29 11 32 5.5C35 11 35.4 17.6 32 22.5Z"/><path transform="rotate(80 32 32)" d="M32 22.5C28.6 17.6 29 11 32 5.5C35 11 35.4 17.6 32 22.5Z"/><path transform="rotate(120 32 32)" d="M32 22.5C28.6 17.6 29 11 32 5.5C35 11 35.4 17.6 32 22.5Z"/><path transform="rotate(160 32 32)" d="M32 22.5C28.6 17.6 29 11 32 5.5C35 11 35.4 17.6 32 22.5Z"/><path transform="rotate(200 32 32)" d="M32 22.5C28.6 17.6 29 11 32 5.5C35 11 35.4 17.6 32 22.5Z"/><path transform="rotate(240 32 32)" d="M32 22.5C28.6 17.6 29 11 32 5.5C35 11 35.4 17.6 32 22.5Z"/><path transform="rotate(280 32 32)" d="M32 22.5C28.6 17.6 29 11 32 5.5C35 11 35.4 17.6 32 22.5Z"/><path transform="rotate(320 32 32)" d="M32 22.5C28.6 17.6 29 11 32 5.5C35 11 35.4 17.6 32 22.5Z"/><circle cx="32" cy="32" r="6.5"/></g><circle cx="32" cy="32" r="2.6" fill="#00aeef"/></svg>

<main class="lock" id="lock">
<div class="card">
<h1>NIRVANA</h1>
<p id="msg">Nirvana key (not your Desk PIN)</p>
<form id="f" autocomplete="off">
<div class="krow"><input id="k" type="password" placeholder="Nirvana key" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Nirvana key"><button type="button" id="kEye" aria-label="Show key" aria-pressed="false">Show</button></div>

</main>

<div id="nvKeyToast" class="toast" role="status" hidden></div>
<script>
var NVK="nirvana_key_v1";
function nvB64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function nvDec(o,pass){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  var k=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:nvB64(o.salt),iterations:o.iter},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:nvB64(o.iv)},k,nvB64(o.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function nvFetch(src){var r=await fetch(src+(src.indexOf("?")<0?"?":"&")+"t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("Couldn't load ("+r.status+")");return r.json()}
(function(){if(window.RealmDevice){RealmDevice.paint();return}try{var dd=(location.search.match(/[?&]d=([A-Za-z0-9_-]{2,20})/)||[])[1]||localStorage.getItem("realm_device")||"";var dev=document.getElementById("nvDev");if(dev)dev.textContent={fold8:"Fold 8",flip6:"Flip 6"}[String(dd).toLowerCase()]||(innerWidth>=900?"Desktop":"Phone")}catch(_){}})();
(function(){
var nvBusy=false,WIN_KEY="nv_win_20261020",deferred=null,openSheet=null;
try{var dm=location.search.match(/[?&]d=([A-Za-z0-9_-]{2,20})(?:&|$)/);if(dm){localStorage.setItem("realm_device",dm[1].toLowerCase());var q=location.search.replace(/([?&])d=[^&]*&?/,"$1").replace(/[?&]$/,"");history.replaceState(null,"",location.pathname+q+location.hash)}}catch(_e){}
function nvFail(x,stored){
  if(!(window.crypto&&crypto.subtle))return "This browser can't unlock here. Open Nirvana in Chrome or Safari over HTTPS.";
  if(x&&x.name==="OperationError")return stored?"Key changed. Enter the new key.":"Wrong key. Try again.";
  var m=String(x&&x.message||x||"");
  if(/Couldn't load|HTTP |Failed to fetch|NetworkError|TypeError/i.test(m))return "Couldn't load the file. Check the signal and try again.";
  return m||"Couldn't unlock.";
}
function toast(msg){var t=document.getElementById("nvKeyToast");if(!t)return;t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true},2400)}
function confetti(){
  var cv=document.getElementById("nvWinCv");if(!cv||!cv.getContext)return;
  var ctx=cv.getContext("2d"),w=cv.width=innerWidth,h=cv.height=innerHeight;
  var colors=["#00aeef","#e0262f","#d4af37","#9b6dff","#c9d3df","#fff"],bits=[],i;
  for(i=0;i<120;i++)bits.push({x:Math.random()*w,y:Math.random()*h,w:8+Math.random()*10,h:28+Math.random()*40,vy:1.6+Math.random()*3,vx:-1.2+Math.random()*2.4,r:Math.random()*6,c:colors[i%colors.length]});
  var t0=performance.now();
  (function frame(now){
    if(document.getElementById("nvWin").hidden)return;
    ctx.clearRect(0,0,w,h);
    bits.forEach(function(b){b.y+=b.vy;b.x+=b.vx;b.r+=0.08;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.r);ctx.fillStyle=b.c;ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);ctx.restore();if(b.y>h+30){b.y=-20;b.x=Math.random()*w}});
    if(now-t0<3200)requestAnimationFrame(frame);
  })(t0);
}
function showWin(done){
  var box=document.getElementById("nvWin"),seen=false;
  try{seen=localStorage.getItem(WIN_KEY)==="1"}catch(e){}
  if(seen||!box){done();return}
  try{localStorage.setItem(WIN_KEY,"1")}catch(e){}
  box.hidden=false;confetti();
  var closed=false;
  function close(){if(closed)return;closed=true;box.hidden=true;done()}
  var btn=document.getElementById("nvWinClose");if(btn)btn.onclick=close;
  setTimeout(close,3000);
}
var NV_MAP={sub:"",people:[]},nvDone=false;
function nvRender(d){
  if(nvDone)return;if(!d||d.v!==1||typeof d.board!=="string"||typeof d.sheets!=="string")throw new Error("Couldn't unlock.");
  document.getElementById("board").innerHTML=d.board;
  document.getElementById("nvPanels").innerHTML=d.sheets;
  var wm=document.getElementById("nvWinMsg");if(wm)wm.textContent=d.win||"";
  NV_MAP=d.map||NV_MAP;nvDone=true;
}
function nvClear(){document.getElementById("board").innerHTML="";document.getElementById("nvPanels").innerHTML="";var wm=document.getElementById("nvWinMsg");if(wm)wm.textContent="";NV_MAP={sub:"",people:[]};nvDone=false}
function hideSheet(){
  if(openSheet)openSheet.hidden=true;
  openSheet=null;
}
function showSheet(id){
  var next=document.getElementById("sheet-"+id);
  if(!next)return;
  if(openSheet&&openSheet!==next)openSheet.hidden=true;
  next.hidden=false;
  openSheet=next;
  var x=next.querySelector("[data-close]");
  if(x)x.focus();
}
function reveal(){
  document.getElementById("lock").hidden=true;
  document.getElementById("board").hidden=false;
  document.body.classList.add("nv-open");
  var h=(location.hash||"").replace(/^#/,"");
  if(h==="flow"||h==="team"||h==="notes")showSheet(h);
}
async function open(pass,stored){
  if(nvBusy)return;
  pass=String(pass||"").trim();
  var e=document.getElementById("e"),b=document.getElementById("b"),w=document.getElementById("gxWait");
  if(!pass)return;
  if(!(window.crypto&&crypto.subtle)){e.textContent=nvFail(null,stored);return}
  nvBusy=true;e.textContent="";b.disabled=true;b.textContent="Unlocking…";if(w)w.hidden=false;
  try{
    var o=await nvFetch("panels.enc.json");var d=await nvDec(o,pass);nvRender(d);localStorage.setItem(NVK,pass);
    b.disabled=false;b.textContent="Unlock";if(w)w.hidden=true;nvBusy=false;
    toast("Key saved on this phone ✓");
    showWin(reveal);
  }catch(x){
    b.disabled=false;b.textContent="Unlock";if(w)w.hidden=true;nvBusy=false;
    if(x&&x.name==="OperationError"&&stored)localStorage.removeItem(NVK);
    e.textContent=nvFail(x,stored);
  }
}
document.addEventListener("click",function(ev){
  var opener=ev.target.closest&&ev.target.closest("[data-open]");
  if(opener){showSheet(opener.getAttribute("data-open"));return}
  if(ev.target.closest&&ev.target.closest("[data-close]")){hideSheet();return}
  if(ev.target.classList&&ev.target.classList.contains("sheet"))hideSheet();
});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape")hideSheet()});
var eye=document.getElementById("kEye"),key=document.getElementById("k");
if(eye&&key)eye.addEventListener("click",function(){
  var show=key.type==="password";
  key.type=show?"text":"password";
  eye.textContent=show?"Hide":"Show";
  eye.setAttribute("aria-label",show?"Hide key":"Show key");
  eye.setAttribute("aria-pressed",show?"true":"false");
});
document.getElementById("f").onsubmit=function(ev){ev.preventDefault();open(document.getElementById("k").value,false)};
var install=document.getElementById("nvInstall"),tip=document.getElementById("nvInstallTip");
window.addEventListener("beforeinstallprompt",function(ev){ev.preventDefault();deferred=ev;if(tip)tip.hidden=true});
if(install)install.addEventListener("click",function(){
  if(deferred){var p=deferred;deferred=null;p.prompt();if(p.userChoice)p.userChoice.then(function(){})}
  else if(tip)tip.hidden=false;
});
document.getElementById("nvLock").addEventListener("click",function(){
  try{localStorage.removeItem(NVK)}catch(e){}
  try{sessionStorage.removeItem(NVK)}catch(e){}
  hideSheet();
  var win=document.getElementById("nvWin");if(win)win.hidden=true;
  document.getElementById("board").hidden=true;
  nvClear();
  document.getElementById("lock").hidden=false;
  document.body.classList.remove("nv-open");
  nvBusy=false;
  var b=document.getElementById("b");if(b){b.disabled=false;b.textContent="Unlock"}
  var w=document.getElementById("gxWait");if(w)w.hidden=true;
  var e=document.getElementById("e");if(e)e.textContent="";
  var k=document.getElementById("k");if(k){k.value="";k.type="password"}
  var eye=document.getElementById("kEye");if(eye){eye.textContent="Show";eye.setAttribute("aria-label","Show key");eye.setAttribute("aria-pressed","false")}
});
document.addEventListener("click",function(ev){if(!(ev.target.closest&&ev.target.closest("#saveMap")))return;
  var cv=document.createElement("canvas");cv.width=900;cv.height=700;
  var ctx=cv.getContext("2d");
  ctx.fillStyle="#0a0a0a";ctx.fillRect(0,0,900,700);
  ctx.fillStyle="#f4f1ea";ctx.font="700 28px system-ui";ctx.fillText("Team",40,56);
  ctx.font="16px system-ui";ctx.fillStyle="#b7b1a8";ctx.fillText(NV_MAP.sub,40,88);
  var people=NV_MAP.people;
  people.forEach(function(p){ctx.beginPath();ctx.strokeStyle=p[1];ctx.lineWidth=3;ctx.arc(p[2]+36,p[3],34,0,Math.PI*2);ctx.stroke();ctx.fillStyle=p[1];ctx.font="700 14px system-ui";ctx.fillText(p[0],p[2]-10,p[3]+58)});
  var toastEl=document.getElementById("nvMapToast");
  function cheer(){toastEl.hidden=false;toastEl.scrollIntoView({block:"nearest"});clearTimeout(cheer._t);cheer._t=setTimeout(function(){toastEl.hidden=true},2400)}
  cv.toBlob(function(blob){
    if(!blob){cheer();return}
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="nirvana-team.png";document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},1500);cheer();
  },"image/png");
});
var s=localStorage.getItem(NVK);if(s)open(s,true);
})();
</script>
