<script>
/* Nirvana shared unlock: AES-256-GCM, PBKDF2-SHA256. Key kept on this device only (localStorage). */
var NVK="nirvana_key_v1";
function nvB64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function nvDec(o,pass){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  var k=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:nvB64(o.salt),iterations:o.iter},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:nvB64(o.iv)},k,nvB64(o.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function nvFetch(src){var r=await fetch(src+(src.indexOf("?")<0?"?":"&")+"t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("Couldn't load ("+r.status+")");return r.json()}
