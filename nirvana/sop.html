<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0f14">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>SOP</title>
<link rel="icon" href="icons/icon-v10-192.png">
<style>
html,body{margin:0;background:#0b0f14;color:#14181d;font:16px/1.45 Georgia,"Iowan Old Style",Palatino,serif}
body{min-height:100vh;box-sizing:border-box;padding:16px 14px 28px}
.bar{display:flex;gap:8px;justify-content:space-between;align-items:center;max-width:210mm;margin:0 auto 12px;font-family:system-ui,sans-serif}
.bar a,.bar button{min-height:44px;border-radius:999px;border:1px solid #d4af37;background:#121820;color:#d4af37;padding:8px 14px;text-decoration:none;font:700 13px system-ui,sans-serif;cursor:pointer}
.card{max-width:210mm;margin:0 auto;background:#fff;color:#14181d;border:1px solid #d4af37;border-radius:18px;padding:22px 18px 26px;box-shadow:0 16px 40px rgba(0,0,0,.28)}
.who{display:flex;align-items:center;gap:14px;margin:0 0 8px}
.who img{width:72px;height:72px;border-radius:16px;display:block;background:#0b0f14;flex:none}
h1{margin:0;font:700 28px/1.15 system-ui,sans-serif;letter-spacing:.02em}
h2{margin:16px 0 6px;font:700 12px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#9c7a1c}
p{margin:0}
ul{margin:0;padding-left:18px}
li{margin:4px 0}
body.pink .bar a,body.pink .bar button{border-color:#ff5fa2;color:#ff5fa2}
body.pink .card{border-color:#ff5fa2}
body.pink h2{color:#ff5fa2}
@page{size:A4 portrait;margin:14mm}
@media print{
  html,body{background:#fff;padding:0}
  .noprint{display:none!important}
  .card{box-shadow:none;border-radius:0;max-width:none;min-height:auto}
}
</style></head>
<body>
<p class="bar noprint"><a id="back" href="index.html">Board</a><button type="button" id="print">Download / Print</button></p>
<article class="card" id="card">
<header class="who"><img id="icon" alt="" width="72" height="72"><h1 id="name">SOP</h1></header>
<h2>What it does</h2><p id="does"></p>
<h2>How it helps you</h2><p id="helps"></p>
<h2>How it saves time</h2><ul id="saves"></ul>
<h2>Rules it follows</h2><ul id="rules"></ul>
</article>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var id=q.get("lane")||q.get("page")||"";
  if(id==="julie"){
    document.body.classList.add("pink");
    document.getElementById("back").href="index.html#julie";
  }
  document.getElementById("print").addEventListener("click",function(){window.print()});
  function list(el,rows){
    el.innerHTML="";
    (rows||[]).forEach(function(t){var li=document.createElement("li");li.textContent=t;el.appendChild(li)});
  }
  function show(hit){
    document.getElementById("name").textContent=hit.name;
    document.getElementById("does").textContent=hit.does;
    document.getElementById("helps").textContent=hit.helps;
    list(document.getElementById("saves"),hit.saves);
    list(document.getElementById("rules"),hit.rules);
    var img=document.getElementById("icon");
    if(hit.icon)img.src=hit.icon;else img.hidden=true;
    document.title=hit.name+" · SOP";
  }
  var blank={name:"SOP",does:"This card is not written yet.",helps:"The card shape is ready.",saves:["Goal: add this card.","Goal: keep the words plain.","Goal: leave secrets off it."],rules:["Nothing gets deleted.","Proof, not promises.","Nothing gets sent without Ange saying yes."],icon:"icons/icon-v10-192.png"};
  fetch("sop.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("sop");return r.json()}).then(function(d){
    var hit=null;
    (d.entries||[]).forEach(function(e){if(e.id===id)hit=e});
    show(hit||blank);
  }).catch(function(){show({name:"SOP",does:"The card file is missing.",helps:"Try again when the file is here.",saves:["Goal: load the card file.","Goal: keep the words plain.","Goal: leave secrets off it."],rules:["Nothing gets deleted.","Proof, not promises.","Nothing gets sent without Ange saying yes."]});});
})();
</script>
</body></html>
