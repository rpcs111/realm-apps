<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<title>Email rules</title>
<style>
html,body{margin:0;background:#0b0f14;color:#e8eef4;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:16px 16px 40px}
.wrap{max-width:720px;margin:0 auto}
.back{display:inline-flex;align-items:center;min-height:44px;margin:0 0 12px;padding:0 14px;border-radius:999px;border:1px solid #26313d;background:#121820;color:#00aeef;font:700 13px ui-monospace,Menlo,monospace;text-decoration:none}
h1{margin:0 0 8px;letter-spacing:.12em;font-size:22px}
.banner{margin:0 0 14px;color:#d4af37;font:700 13px ui-monospace,Menlo,monospace}
.say{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.say input{flex:1;min-width:180px;margin:0;text-align:left;padding:12px;border-radius:12px;border:1px solid #26313d;background:#121820;color:#e8eef4;font:inherit}
.say button,.card button{min-height:44px;border-radius:12px;border:1px solid #26313d;background:#0b0f14;color:#00aeef;padding:8px 12px;cursor:pointer;font:700 14px system-ui}
.saystatus{min-height:20px;margin:0 0 12px;color:#8a98a8;font-size:13px}
.card{border:1px solid #26313d;border-radius:14px;background:#121820;padding:12px;margin:0 0 8px}
.card h2{margin:0 0 8px;font-size:15px}
.card .row{display:flex;flex-wrap:wrap;gap:6px}
h3{margin:16px 0 8px;font-size:16px}
#wait{margin:0;padding-left:18px}
#wait li{margin:4px 0}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">Board</a>
<h1>EMAIL RULES</h1>
<p class="banner">Draft. Nothing runs until Ange says yes.</p>
<form class="say" id="sayForm">
<input id="sayLine" type="text" autocomplete="off" aria-label="Queue a line, for example archive newsletters" placeholder="archive newsletters">
<button type="button" id="sayMic" class="mic" aria-label="Mic"><svg class="mic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6.2" y="1.5" width="11.6" height="9.4" rx="4.2" fill="currentColor" fill-opacity=".3"/><path d="M8 4.7h8M7.8 7.8h8.4" stroke-width="1.6"/><path d="M8.9 10.9v2.3a1.5 1.5 0 0 0 1.5 1.5h3.2a1.5 1.5 0 0 0 1.5-1.5v-2.3"/><path d="M5.6 13.6a6.4 5.4 0 0 0 12.8 0" stroke-width="2.4"/><path d="M12 19.2v2.2M8.3 21.8h7.4"/></svg></button>
<button type="submit">Queue</button>
</form>
<p class="saystatus" id="sayStatus" role="status"></p>
<h3>Waiting for Ange's yes</h3>
<ul id="wait"></ul>
<div id="cards"></div>
</div>
<script>
var NV_EMAIL_KEY="nv_email_action_queue";
var NV_EMAIL_GROUPS=[
  "Strata quote requests and tenders",
  "Replies to Zoho estimates",
  "Work orders and purchase orders",
  "Remittance advices",
  "Supplier bills and statements",
  "Order and delivery updates",
  "Anthropic receipts",
  "UniFi access alerts",
  "Sign-in links, codes and alerts",
  "Xero payment authorisation codes",
  "Payment and bank notices",
  "xAI / Grok spend",
  "Self-sent REALM EOD",
  "Newsletters and promotions",
  "Zoho Books weekly report",
  "SEEK recruiting",
  "Xero supplier statements",
  "Client replies to Realm invoices",
  "Zoho undelivered payment mail",
  "Website and hosting alerts",
  "Overdue or collection notices",
  "GitHub notifications",
  "Calendar acceptances and bookings",
  "Fines Victoria reminders",
  "Zapier weekly task summary"
];
var NV_EMAIL_ACTIONS=["label","archive","file"];
function parseEmailLine(line, groups){
  var s=String(line||"").trim();
  var m=s.match(/^(label|archive|file)\s+(.+)$/i);
  if(!m) return {error:"Say label, archive or file, then the group."};
  var action=m[1].toLowerCase();
  var q=m[2].trim().toLowerCase();
  if(/\b\d{4,}\b/.test(q)) return {error:"Codes are not kept."};
  var hit=null, ambiguous=false;
  (groups||[]).forEach(function(name){
    var n=String(name).trim().toLowerCase();
    if(n===q||n.indexOf(q)>=0){
      if(hit&&hit!==name) ambiguous=true;
      hit=name;
    }
  });
  if(ambiguous) return {error:"Which group?"};
  if(!hit) return {error:"No group by that name."};
  return {group:hit, action:action};
}
function loadQueue(){
  try{var v=JSON.parse(localStorage.getItem(NV_EMAIL_KEY)||"[]");return Array.isArray(v)?v:[]}catch(e){return []}
}
function queueAction(group, action){
  action=String(action||"").toLowerCase();
  if(NV_EMAIL_ACTIONS.indexOf(action)<0) return loadQueue();
  var list=loadQueue();
  if(!list.some(function(x){return x.group===group&&x.action===action})) list.push({group:group, action:action});
  localStorage.setItem(NV_EMAIL_KEY, JSON.stringify(list));
  return list;
}
function paintWait(){
  var host=document.getElementById("wait");
  host.textContent="";
  var list=loadQueue();
  if(!list.length){
    var empty=document.createElement("li");
    empty.textContent="None yet.";
    host.appendChild(empty);
    return;
  }
  list.forEach(function(item){
    var li=document.createElement("li");
    li.textContent=item.group+" \u00b7 "+item.action;
    host.appendChild(li);
  });
}
function setStatus(text){document.getElementById("sayStatus").textContent=text||""}
function takeLine(line){
  var parsed=parseEmailLine(line, NV_EMAIL_GROUPS);
  if(parsed.error){setStatus(parsed.error);return}
  queueAction(parsed.group, parsed.action);
  document.getElementById("sayLine").value="";
  setStatus("Queued on this phone.");
  paintWait();
}
var host=document.getElementById("cards");
NV_EMAIL_GROUPS.forEach(function(name){
  var card=document.createElement("article");
  card.className="card";
  var h=document.createElement("h2");
  h.textContent=name;
  var row=document.createElement("div");
  row.className="row";
  NV_EMAIL_ACTIONS.forEach(function(action){
    var b=document.createElement("button");
    b.type="button";
    b.textContent=action;
    b.addEventListener("click", function(){queueAction(name, action);setStatus("Queued on this phone.");paintWait()});
    row.appendChild(b);
  });
  card.appendChild(h);
  card.appendChild(row);
  host.appendChild(card);
});
document.getElementById("sayForm").addEventListener("submit", function(ev){ev.preventDefault();takeLine(document.getElementById("sayLine").value)});
document.getElementById("sayMic").addEventListener("click", function(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var input=document.getElementById("sayLine");
  if(!SR){setStatus("Type the line. Speech is not on this phone.");input.focus();return}
  var rec=new SR();
  rec.lang="en-AU";
  rec.onresult=function(ev){var said="";try{said=ev.results[0][0].transcript||""}catch(e){}input.value=said;takeLine(said)};
  rec.onerror=function(){setStatus("Type the line. Speech did not start.")};
  try{rec.start();setStatus("Listening\u2026")}catch(e){setStatus("Type the line. Speech did not start.")}
});
paintWait();
</script>
</body>
</html>
