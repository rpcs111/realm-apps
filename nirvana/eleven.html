<title>11:11</title>
<link rel="icon" href="icons/icon-v10-192.png">
<style>
html,body{margin:0;background:#0b0f14;color:#e8eef4;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:64px 16px 80px;box-sizing:border-box}
.card{width:100%;max-width:320px;text-align:center}
.card>img{width:72px;height:72px;border-radius:16px;display:block;margin:0 auto 8px}
h1{margin:0;letter-spacing:.16em;font-size:18px}
#ask{color:#8a98a8;margin:8px 0 12px}
.dots{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.dots i{width:12px;height:12px;border-radius:50%;border:1px solid #d4af37;display:block}
.dots i.on{background:#d4af37}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:52px;border-radius:12px;border:1px solid #26313d;background:#121820;color:#e8eef4;font:700 18px system-ui;cursor:pointer}
#out{min-height:22px;margin:14px 0 0;color:#d4af37;font-weight:700}
.tf{position:fixed;z-index:70;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));box-sizing:border-box;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #d4af37;border-radius:12px;background:#121820}
.tf img{width:22px;height:22px;display:block}
#cue42{position:fixed;z-index:70;left:calc(10px + env(safe-area-inset-left));bottom:calc(10px + env(safe-area-inset-bottom));box-sizing:border-box;min-width:44px;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid #26313d;background:#121820;color:#8a98a8;font:700 12px ui-monospace,Menlo,monospace;cursor:pointer}
.cue-toast{position:fixed;z-index:90;left:50%;top:14px;transform:translateX(-50%);max-width:min(92vw,560px);background:#121820;color:#e8eef4;border:1px solid #d4af37;border-radius:12px;padding:12px 14px;font:700 14px/1.35 ui-monospace,Menlo,monospace;text-align:center}
.cue-toast.pass{color:#60ff15;border-color:#60ff15}
.cue-toast.fail{color:#ff5a5a;border-color:#ff5a5a}
</style></head>
<body>
<a class="tf" href="terafab.html" aria-label="Terafab"><img src="../pwa/lanes/terafab.svg" width="22" height="22" alt=""></a>
<div class="card">
<img src="icons/icon-v10-192.png" width="72" height="72" alt="">
<h1>11:11</h1>
<p id="ask">Enter PIN</p>
<div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="pad" id="pad"></div>
<p id="out" role="status"></p>
</div>
<button type="button" id="cue42">42</button>
<div id="cueToast" class="cue-toast" role="status" hidden></div>
<script>
function nvB64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function nvDec(o,pass){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  var k=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:nvB64(o.salt),iterations:o.iter},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:nvB64(o.iv)},k,nvB64(o.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
(function(){
  var digits="";
  var pad=document.getElementById("pad");
  function paint(){
    var ds=document.querySelectorAll("#dots i");
    for(var i=0;i<ds.length;i++)ds[i].className=i<digits.length?"on":"";
  }
  function key(ch){
    if(ch==="x"){digits=digits.slice(0,-1);paint();return}
    if(digits.length>=4)return;
    digits+=ch;paint();
    if(digits.length===4){var pin=digits;digits="";paint();openVault(pin)}
  }
  var labels=["1","2","3","4","5","6","7","8","9","x","0"];
  labels.forEach(function(ch){
    var b=document.createElement("button");
    b.type="button";
    b.textContent=ch==="x"?"⌫":ch;
    b.setAttribute("aria-label",ch==="x"?"Delete":ch);
    b.addEventListener("click",function(){key(ch)});
    pad.appendChild(b);
  });
  document.addEventListener("keydown",function(e){
    if(e.key>="0"&&e.key<="9"){key(e.key);e.preventDefault()}
    else if(e.key==="Backspace"){key("x");e.preventDefault()}
  });
  async function openVault(pin){
    var out=document.getElementById("out");
    out.textContent="";
    try{
      var r=await fetch("eleven.enc.json",{cache:"no-store"});
      if(!r.ok){out.textContent="sealed";return}
      var o=await r.json();
      if(!o.iter)o.iter=210000;
      var d=await nvDec(o,pin);
      if(d&&typeof d.html==="string"){document.open();document.write(d.html);document.close();return}
      out.textContent="sealed";
    }catch(e){
      out.textContent=(e&&e.name==="OperationError")?"That PIN did not open the vault.":"sealed";
    }
  }
})();
</script>
<script src="cue42.js"></script>
</body></html>
