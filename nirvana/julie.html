<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">

<title>Julie</title>
<link rel="icon" href="../pwa/lanes/julie.svg">
<style>
html,body{margin:0;background:#0b0f14;color:#e8eef4;font:17px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:28px 16px 80px}
.wrap{max-width:520px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header img{width:56px;height:56px}
h1{margin:0;font-size:28px;color:#ff5fa2}
.grid{display:grid;gap:12px}
.grid button{min-height:92px;border-radius:18px;border:1px solid #ff5fa2;background:linear-gradient(165deg,#121820,#0b0f14);color:#fff;font:700 22px/1.25 system-ui;text-align:left;padding:16px 18px;cursor:pointer}
#note{min-height:24px;margin:14px 0 0;color:#ff5fa2;font-weight:700}
#cue42{position:fixed;z-index:70;left:calc(10px + env(safe-area-inset-left));bottom:calc(10px + env(safe-area-inset-bottom));box-sizing:border-box;min-width:44px;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid #ff5fa2;background:#121820;color:#ff5fa2;font:700 12px ui-monospace,Menlo,monospace;cursor:pointer}
.cue-toast{position:fixed;z-index:90;left:50%;top:14px;transform:translateX(-50%);max-width:min(92vw,560px);background:#121820;color:#e8eef4;border:1px solid #ff5fa2;border-radius:12px;padding:12px 14px;font:700 14px/1.35 ui-monospace,Menlo,monospace;text-align:center}
.cue-toast.pass{color:#60ff15;border-color:#60ff15}
.cue-toast.fail{color:#ff5a5a;border-color:#ff5a5a}
</style></head>
<body>
<div class="wrap">
<header><img src="../pwa/lanes/julie.svg" alt=""><h1>Julie</h1></header>
<div class="grid">
<button type="button">What's on today?</button>
<button type="button">Tick a job done</button>
<button type="button">Add a note</button>
<button type="button">Ask Ara</button>
<button type="button">Push back on this</button>
</div>
<p id="note" role="status"></p>
</div>
<button type="button" id="cue42">42</button>
<div id="cueToast" class="cue-toast" role="status" hidden></div>
<script>
document.querySelectorAll(".grid button").forEach(function(b){
  b.addEventListener("click",function(){document.getElementById("note").textContent=b.textContent});
});
</script>
<script src="cue42.js"></script>
</body></html>
