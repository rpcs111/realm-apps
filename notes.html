*{box-sizing:border-box}html,body{overflow-x:hidden;background:#000}
body{margin:0;background:#000;color:#fff;font:16px/1.45 "Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,system-ui,Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding:calc(12px + env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom))}
.wrap{max-width:680px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top a{color:var(--m);text-decoration:none;font-size:13px;letter-spacing:.08em;padding:8px 0}.top a:hover{color:#fff}
.brand{display:flex;align-items:center;gap:12px;margin:14px 0 4px}.mark{width:44px;height:44px;flex:none;background:var(--ara) center/contain no-repeat;border-radius:10px}
h1{font-size:15px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;margin:0}h2{font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--m);margin:28px 0 8px}
.sub{font-size:12px;color:#a1a1aa;margin:2px 0 14px;letter-spacing:.04em}
.box{background:#0a0a0a;border:1px solid var(--l);border-radius:16px;padding:12px}
textarea{width:100%;min-height:110px;border:1px solid var(--l);background:#000;color:#fff;border-radius:12px;padding:12px;font:17px/1.4 sans-serif;font-family:inherit;resize:vertical;outline:none}textarea:focus{border-color:var(--c)}
.btns{display:flex;gap:8px;margin-top:10px}
.btns button{border-radius:999px;font:500 15px sans-serif;font-family:inherit;letter-spacing:.06em;min-height:56px;padding:0 18px;cursor:pointer}
.micI{display:inline-block;width:30px;height:30px;flex:none;background:var(--mic) center/contain no-repeat;vertical-align:middle}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid #171717;align-items:flex-start}
.tick{flex:0 0 30px;height:30px;border-radius:50%;border:1.5px solid #3f3f46;background:transparent;color:#000;font-size:16px;padding:0;margin-top:1px;cursor:pointer}
.tick.d{background:var(--c);border-color:var(--c)}
.b{flex:1;min-width:0}.t{font-weight:500;overflow-wrap:anywhere}.d .t{text-decoration:line-through;color:#a1a1aa}
.n{font-size:13px;color:var(--m);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px}
.x{border:0;background:none;color:#a1a1aa;font-size:20px;min-width:36px;min-height:36px;cursor:pointer}.x:hover{color:#fff}
.src{font-size:12px;color:var(--m);background:#0a0a0a;border-left:2px solid var(--c);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.row a,.row button{flex:1 1 auto;text-align:center;border:1px solid #2a2a2a;background:#000;color:#e4e4e7;border-radius:999px;padding:12px;font:500 13px sans-serif;font-family:inherit;letter-spacing:.04em;text-decoration:none;min-height:44px;cursor:pointer}.row a:hover,.row button:hover{border-color:var(--c);color:#fff}
.th{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 8px}.th h2{margin:0}.gt{flex:none;border:1px solid var(--c);color:#fff;background:#000;border-radius:999px;padding:9px 16px;min-height:40px;display:inline-flex;align-items:center;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;box-shadow:0 0 14px rgba(34,211,238,.25)}.gt:hover{background:rgba(34,211,238,.12)}
.addt{display:inline-flex;align-items:center;gap:4px;margin-top:6px;min-height:34px;padding:4px 12px;border-radius:999px;border:1px solid #22d3ee;background:#000;color:#e0f2fe;font:600 12px system-ui,sans-serif;cursor:pointer;text-decoration:none}.addt.q{border-color:#f59e0b;color:#fcd34d}.addt.ok{border-color:#22c55e;color:#86efac}
.cnt{font-size:12px;color:#a1a1aa;letter-spacing:.04em;text-transform:none}.empty{color:#a1a1aa;padding:12px 2px}
#micMsg{font-size:15px;font-weight:700;color:#fff;text-align:center;background:#111827;border:1px solid #374151;border-radius:999px;padding:7px 14px;width:max-content;max-width:100%;margin:0 auto 6px}#arbBtn{display:none!important}
.rlab{display:inline-block;margin:6px 6px 0 0;padding:3px 10px;border-radius:999px;font:700 12px system-ui,sans-serif;border:1px solid #3f3f46;color:#e4e4e7}.rlab.ok{border-color:#22c55e;color:#86efac}.rlab.q{border-color:#f59e0b;color:#fcd34d}
.rui-main{padding-bottom:110px}
/* 17 Oct clean-up (Ange): compact chips, Ara symbol, Save app visible, done hidden, Google Tasks columns */
.rui #araSave{font-size:11px!important;gap:5px!important;padding:0 10px!important;letter-spacing:.06em!important;height:30px!important;min-height:30px!important;box-shadow:none!important}
#araSym{all:unset;box-sizing:border-box;flex:none;width:36px;height:36px;border-radius:50%;background:var(--ara) center/cover no-repeat;border:1.5px solid #a78bfa;cursor:pointer;-webkit-tap-highlight-color:transparent}#araSym:focus-visible{outline:2px solid #fff;outline-offset:2px}#araSym.ok{border-color:#22c55e;box-shadow:0 0 10px rgba(34,197,94,.6)}
.addt{min-height:24px;margin-top:4px;padding:1px 9px;font:600 11px system-ui,sans-serif}
.rui-list li .gt{display:inline-block;min-height:0;padding:2px 8px;margin:4px 6px 0 0;font-size:11px;letter-spacing:0;text-transform:none;box-shadow:none;border-color:var(--rui-line,#333);color:#67e8f9}
.x{min-width:28px;min-height:28px;font-size:17px}
.tick{flex:0 0 22px;height:22px;font-size:12px}
.showd[hidden]{display:none!important}.showd{all:unset;cursor:pointer;font-size:11.5px;color:#67e8f9;padding:6px 8px;display:inline-block}.showd:hover{text-decoration:underline}
.gcols{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.gcol{flex:1 0 260px;max-width:360px;min-width:0;scroll-snap-align:start;background:rgba(8,24,36,.55);border:1px solid rgba(148,197,214,.14);border-radius:12px;padding:6px 4px}
.gcol h3{margin:2px 6px 4px;font-size:12px;font-weight:600;letter-spacing:.04em;color:#e6f7fb;display:flex;justify-content:space-between;gap:6px}.gcol h3 i{font-style:normal;color:#a9c1cc;font-weight:400}
.gcol ul li{padding:6px 6px}.gcol li.sub{padding-left:30px}.gcol .due{display:inline-block;font-size:11px;color:#a5f3fc;border:1px solid rgba(34,211,238,.35);border-radius:999px;padding:0 7px;margin-top:3px}
@media(max-width:560px){.gcol{flex-basis:calc(100vw - 48px)}}
#vMic{display:none!important;background:#000 var(--mic) center/30px no-repeat!important;border:1px solid var(--c)!important;font-size:0!important;color:transparent!important}#vMic.on{background-color:rgba(34,211,238,.15)!important;box-shadow:0 0 22px rgba(34,211,238,.6)!important}
