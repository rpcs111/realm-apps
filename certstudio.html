*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#fff;height:100%}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;font:400 15px/1.45 "Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;padding:calc(24px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom))}
#go{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#fff;-webkit-tap-highlight-color:transparent}
#go img{width:min(56vw,240px);height:min(56vw,240px);display:block;transition:transform .2s ease}
#go:hover img,#go:active img{transform:scale(.97)}
#go b{margin-top:22px;font-weight:500;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:#fff}
#go span{margin-top:8px;font-size:12px;letter-spacing:.08em;color:#22d3ee}
#save{margin-top:56px;background:none;border:1px solid #2a2a2a;color:#a1a1aa;font:500 12px/1 inherit;letter-spacing:.18em;text-transform:uppercase;padding:13px 22px;border-radius:999px;cursor:pointer}
#save:hover{border-color:#22d3ee;color:#fff}
#help{display:none;margin-top:18px;max-width:340px;font-size:12px;color:#a1a1aa;text-align:center}
#help b{color:#fff;font-weight:500}
