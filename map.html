<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realm Flow Map</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1d33;color:#e2e8f0;font:15px system-ui,sans-serif;overflow-x:hidden}
header{padding:12px 14px}h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:#94a3b8;font-size:13px}
#wrap{max-width:900px;margin:0 auto;padding:0 8px}svg{width:100%;height:auto;display:block}
.nt{font:600 15px system-ui;fill:#fff;text-anchor:middle;pointer-events:none}.ns{font:12px system-ui;fill:#cbd5e1;text-anchor:middle;pointer-events:none}
g.node{cursor:pointer}g.node.sel circle{stroke:#facc15!important}
#list{max-width:900px;margin:0 auto;padding:8px}.card{background:#12304f;border-radius:12px;padding:10px;margin:8px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card b{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}.card a{color:#67e8f9;overflow-wrap:anywhere}.card textarea{flex:1 1 100%;min-height:44px;background:#0b1d33;color:#fff;border:1px solid #334155;border-radius:8px;padding:6px;font:14px system-ui}
button{border:0;border-radius:10px;padding:8px 12px;font:600 14px system-ui;background:#1e3a5f;color:#fff}button.mic{background:#dc2626}button.mic.on{background:#16a34a}
.legend{font-size:13px;color:#94a3b8;padding:0 14px}.legend span{display:inline-block;margin-right:12px}
#links{max-width:900px;margin:0 auto;padding:8px 14px 120px}#links a{color:#67e8f9;display:block;padding:6px 0;overflow-wrap:anywhere}
</style></head><body>
<header><h1>Realm Flow Map</h1><p>Google Calendar is the source of truth. Every step updates the Open Register. Tap a step to edit.</p></header>
<div class="legend"><span>&#8594; main flow</span><span>&#8674; loop-back</span><span style="color:#a78bfa">&#8901;&#8901; updates Register</span></div>
<div id="wrap"><svg id="map" viewBox="0 0 1000 1000" role="img" aria-label="Realm Flow Map"></svg></div>
<div id="list"></div>
<div id="links"><b>Links</b>
<a href="https://script.google.com/macros/s/AKfycbxhGb1O-6S6C2PJS92EEuViEBDu0wj2AGTzgkGtm_7MixmXsepE-XxF9rgly0f6SwARGw/exec" target="_blank" rel="noopener">Realm Desk v9</a>
<a href="https://script.google.com/macros/s/AKfycbwFil-RiQujoffiDoBnGk6YvjLuyr1vaqCQKVUPtWT9NmGVQryPcwEsjIlieL93Yps/exec" target="_blank" rel="noopener">Cert Studio</a>
<a href="./scribe.html">You Got Me Bro</a>
<a href="https://calendar.google.com/calendar/u/0/r" target="_blank" rel="noopener">Google Calendar (source of truth)</a>
<a href="https://docs.google.com/spreadsheets/d/1REJWxu7oD3MY9z7TCPsv-OznnPTu1lAHsONMlU8refM/edit" target="_blank" rel="noopener">REALM OPEN REGISTER</a>
<a href="https://script.google.com/macros/s/AKfycbyraSxweXHy2Io-vI4rJ9pGskyKzIedY1PdtYPYtybupFfovZsoP7ROLWEvdAnZIcs/exec" target="_blank" rel="noopener">24 Sep original</a>
<button id="wipe" style="margin-top:12px">Reset map to defaults</button></div>
<script>
const KEY='realm_flow_map_v3',NS='http://www.w3.org/2000/svg';let MEM=null;
const DESK='https://script.google.com/macros/s/AKfycbxhGb1O-6S6C2PJS92EEuViEBDu0wj2AGTzgkGtm_7MixmXsepE-XxF9rgly0f6SwARGw/exec',CERT='https://script.google.com/macros/s/AKfycbwFil-RiQujoffiDoBnGk6YvjLuyr1vaqCQKVUPtWT9NmGVQryPcwEsjIlieL93Yps/exec',YGMB='./scribe.html',BOOKS='https://books.zoho.com/app',CAL='https://calendar.google.com/calendar/u/0/r',REG='https://docs.google.com/spreadsheets/d/1REJWxu7oD3MY9z7TCPsv-OznnPTu1lAHsONMlU8refM/edit';
function defaults(){const s=[['Enquiry','Gmail · 1300 SipTalk · WhatsApp','https://mail.google.com/mail/u/0/#inbox'],['Log','You Got Me Bro',YGMB],['Quote','Zoho Books',BOOKS+'#/quotes'],['Follow-up','You Got Me Bro',YGMB],['Book','Google Calendar',CAL],['Roster','Deputy (look-only)','https://once.deputy.com'],['Job day','Desk v9',DESK],['Cert','Cert Studio',CERT],['Invoice','Zoho Books',BOOKS+'#/invoices'],['Close','Open Register',REG]];
 return {nodes:s.map((x,i)=>({id:'s'+(i+1),n:i+1,title:x[0],tool:x[1],link:x[2],note:''})).concat([{id:'ara',n:0,title:'Ara',tool:'head · reads logs',link:'',note:''},{id:'nova',n:0,title:'Nova',tool:'writes code · own log',link:'',note:''}])}}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){d=MEM}return d&&Array.isArray(d.nodes)?d:defaults()}
function save(){const t=JSON.stringify(S);try{localStorage.setItem(KEY,t)}catch(e){MEM=JSON.parse(t)}}
let S=load(),sel=null;
const C=500,R=390,POS=i=>{const a=-Math.PI/2+i*2*Math.PI/10;return [C+R*Math.cos(a),C+R*Math.sin(a)]},NR=62;
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
const svg=document.getElementById('map');
function edge(p,q,dash,col,bend,r1,r2){const dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;const a=[p[0]+ux*r1,p[1]+uy*r1],b=[q[0]-ux*r2,q[1]-uy*r2];
 const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,cx=mx+(C-mx)*bend,cy=my+(C-my)*bend;
 el('path',{d:`M${a[0]},${a[1]} Q${cx},${cy} ${b[0]},${b[1]}`,fill:'none',stroke:col,'stroke-width':dash?2.5:4,'stroke-dasharray':dash||'','marker-end':'url(#ah'+(col=='#22d3ee'?'m':col=='#f59e0b'?'l':'r')+')'})}
function draw(){svg.innerHTML='';const d=el('defs',{});[['m','#22d3ee'],['l','#f59e0b'],['r','#a78bfa']].forEach(([k,c])=>{const m=el('marker',{id:'ah'+k,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},d);el('path',{d:'M0,0L10,5L0,10z',fill:c},m)});
 const cal=[C,C-60],reg=[C,C+75];
 for(let i=0;i<10;i++)edge(POS(i),reg,'3 7','#a78bfa',0,NR,58);
 for(let i=0;i<10;i++)edge(POS(i),POS((i+1)%10),'','#22d3ee',-0.12,NR+2,NR+4);
 [[3,5],[4,3],[8,2],[10,4]].forEach(([a,b])=>edge(POS(a-1),POS(b-1),'10 7','#f59e0b',a==10?0.35:a==4?-0.35:0.55,NR+2,NR+4));
 const hub=(p,r,f,t1,t2,u)=>{const g=el('g',{class:'node'});el('circle',{cx:p[0],cy:p[1],r,fill:f,stroke:'#fff','stroke-width':3},g);el('text',{x:p[0],y:p[1]-2,class:'nt'},g).textContent=t1;el('text',{x:p[0],y:p[1]+16,class:'ns'},g).textContent=t2;g.onclick=()=>window.open(u,'_blank')};
 hub(cal,70,'#14532d','Google Calendar','source of truth',CAL);hub(reg,58,'#3b0764','Register','every step',REG);
 S.nodes.forEach((n,k)=>{const p=n.n?POS(n.n-1):(n.id=='ara'?[70,935]:[930,935]);const r=n.n?NR:52;const g=el('g',{class:'node'+(sel==n.id?' sel':''),'data-id':n.id});
  el('circle',{cx:p[0],cy:p[1],r,fill:n.n?'#0f2a47':'#334155',stroke:n.n?'#22d3ee':'#94a3b8','stroke-width':4,'stroke-dasharray':n.n?'':'6 4'},g);
  el('text',{x:p[0],y:p[1]-4,class:'nt'},g).textContent=(n.n?n.n+' ':'')+n.title;
  const t=n.tool.length>18?n.tool.slice(0,17)+'…':n.tool;el('text',{x:p[0],y:p[1]+16,class:'ns'},g).textContent=t;
  g.onclick=()=>{sel=n.id;draw();const c=document.getElementById('c_'+n.id);c&&c.scrollIntoView({behavior:'smooth',block:'center'})}})}
let rec=null;
function dictate(n,btn,ta){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice not supported in this browser.');return}
 if(rec){rec.stop();return}rec=new SR();rec.lang='en-AU';rec.interimResults=false;btn.classList.add('on');
 rec.onresult=e=>{const t=e.results[0][0].transcript;/* voice only ever appends text; it cannot delete or skip the PIN */ta.value=(ta.value?ta.value+' ':'')+t;n.note=ta.value;save()};
 rec.onend=()=>{btn.classList.remove('on');rec=null};rec.start()}
function list(){const L=document.getElementById('list');L.innerHTML='';S.nodes.forEach(n=>{const c=document.createElement('div');c.className='card';c.id='c_'+n.id;
 c.innerHTML=`<b contenteditable="true"></b>${n.link?`<a target="_blank" rel="noopener"></a>`:''}<button class="mic" title="Dictate a note">&#127908;</button><button class="clr">Clear note</button><textarea placeholder="Notes"></textarea>`;
 const b=c.querySelector('b'),ta=c.querySelector('textarea');b.textContent=(n.n?n.n+'. ':'')+n.title+' · '+n.tool;ta.value=n.note||'';
 if(n.link){const a=c.querySelector('a');a.href=n.link;a.textContent='open'}
 b.onblur=()=>{const v=b.textContent.replace(/^\d+\.\s*/,'');const i=v.indexOf(' · ');n.title=(i<0?v:v.slice(0,i)).trim()||n.title;if(i>=0)n.tool=v.slice(i+3).trim();save();draw()};
 ta.oninput=()=>{n.note=ta.value;save()};c.querySelector('.mic').onclick=e=>dictate(n,e.target,ta);
 c.querySelector('.clr').onclick=()=>{if(!ta.value)return;gate('Delete the note on "'+n.title+'"?').then(ok=>{if(!ok)return;n.note='';ta.value='';save()})};L.appendChild(c)})}
document.getElementById('wipe').onclick=()=>gate('Reset the map to defaults? Your edits and notes in this browser are deleted.').then(ok=>{if(ok){S=defaults();save();draw();list()}});
draw();list();
</script><div id="pinx" style="position:fixed;inset:0;z-index:9999;background:#0b1d33;color:#fff;display:flex;align-items:center;justify-content:center;font:16px system-ui,sans-serif;padding:16px">
<div style="width:100%;max-width:320px;text-align:center"><div style="font-size:40px">&#128274;</div><h2 id="pinT" style="margin:8px 0 4px">Realm Map</h2><div id="pinM" style="color:#cbd5e1;font-size:14px;min-height:20px;margin-bottom:12px"></div>
<input id="pinI" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" style="width:100%;font-size:28px;letter-spacing:.5em;text-align:center;padding:12px;border-radius:12px;border:0;margin-bottom:10px">
<button id="pinOk" style="width:100%;padding:14px;border:0;border-radius:12px;background:#22d3ee;color:#0b1d33;font:700 17px sans-serif;margin-bottom:8px">Unlock</button>
<button id="pinNo" style="width:100%;padding:12px;border:0;border-radius:12px;background:#1e3a5f;color:#fff;font:600 15px sans-serif;display:none">Cancel</button>
<button id="pinF" style="background:none;border:0;color:#94a3b8;font-size:14px;margin-top:10px;padding:10px">Forgot PIN</button></div></div>
<script>
(function(){
var PK='realm_map_pin_v1',SK='realm_map_unlocked';var memPin=null,memUnl=false;
function lg(k){try{return localStorage.getItem(k)}catch(e){return k===PK?memPin:null}}
function ls(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){if(k===PK)memPin=v}}
function sg(){try{return sessionStorage.getItem(SK)==='1'}catch(e){return memUnl}}
function ss(){memUnl=true;try{sessionStorage.setItem(SK,'1')}catch(e){}}
function hash(p){var t='realm-map|'+p;if(window.crypto&&crypto.subtle)return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')});var h=5381;for(var i=0;i<t.length;i++)h=(h*33^t.charCodeAt(i))>>>0;return Promise.resolve('d'+h.toString(16))}
var X=document.getElementById('pinx'),T=document.getElementById('pinT'),M=document.getElementById('pinM'),I=document.getElementById('pinI'),OK=document.getElementById('pinOk'),NO=document.getElementById('pinNo'),F=document.getElementById('pinF');
var mode,first,done;
function show(m,title,msg,btn,cancel){mode=m;T.textContent=title;M.textContent=msg;OK.textContent=btn;NO.style.display=cancel?'block':'none';F.style.display=m==='unlock'?'inline-block':'none';I.value='';X.style.display='flex';setTimeout(function(){I.focus()},50)}
function start(){if(!lg(PK))show('set1','Set your PIN','First time: choose a 4-digit PIN.','Next');else if(sg())X.style.display='none';else show('unlock','Realm Map','Enter your PIN.','Unlock')}
function submit(){var v=I.value;if(!/^\d{4}$/.test(v)){M.textContent='Enter exactly 4 digits.';return}
 if(mode==='set1'){first=v;show('set2','Confirm PIN','Type the same 4 digits again.','Save PIN');return}
 if(mode==='set2'){if(v!==first){show('set1','Set your PIN',"PINs didn't match. Try again.",'Next');return}hash(v).then(function(h){ls(PK,h);ss();X.style.display='none'});return}
 hash(v).then(function(h){var ok=h===lg(PK);
  if(mode==='unlock'){if(ok){ss();X.style.display='none'}else{M.textContent='Wrong PIN.';I.value=''}}
  else if(mode==='gate'){if(ok){X.style.display='none';var d=done;done=null;d(true)}else{M.textContent='Wrong PIN. Nothing was deleted.';I.value=''}}})}
OK.onclick=submit;I.onkeydown=function(e){if(e.key==='Enter')submit()};
NO.onclick=function(){X.style.display='none';var d=done;done=null;d&&d(false)};
F.onclick=function(){if(confirm('Reset the PIN only? Your map is not touched.')){ls(PK,null);show('set1','Set a new PIN','Choose a new 4-digit PIN. Map data is unchanged.','Next')}};
window.gate=function(q){return new Promise(function(res){
 if(!confirm(q)){res(false);return}
 if(!confirm("Are you sure? This can't be undone.")){res(false);return}
 if(!lg(PK)){res(false);start();return}
 done=res;show('gate','Confirm with PIN','Enter your PIN to finish.','Confirm',true)})};
start();
})();
</script>
<script src="voice.js"></script>
</body></html>
