#wrap{max-width:900px;margin:0 auto;padding:0 8px}svg{width:100%;height:auto;display:block}
.nt{font:600 15px system-ui;fill:#fff;text-anchor:middle;pointer-events:none}.ns{font:12px system-ui;fill:#cbd5e1;text-anchor:middle;pointer-events:none}
g.node{cursor:pointer}g.node.sel circle{stroke:#facc15!important}
#list{max-width:900px;margin:0 auto;padding:8px}.card{background:#12304f;border-radius:12px;padding:10px;margin:8px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card b{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}.card a{color:#67e8f9;overflow-wrap:anywhere}.card textarea{flex:1 1 100%;min-height:44px;background:rgba(14,22,44,.55);color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px;font:14px system-ui}
button{border:0;border-radius:10px;padding:8px 12px;font:600 14px system-ui;background:#1e3a5f;color:#fff}button.mic{background:#dc2626}button.mic.on{background:#16a34a}
.legend{font-size:13px;color:#94a3b8;padding:0 14px}.legend span{display:inline-block;margin-right:12px}
#links{max-width:900px;margin:0 auto;padding:8px 14px 120px}#links a{color:#67e8f9;display:block;padding:6px 0;overflow-wrap:anywhere}

<header><h1>Realm Flow Map</h1><p>Google Calendar is the source of truth. Every step updates the Open Register. Tap a step to edit.</p></header>
<div class="legend"><span>&#8594; main flow</span><span>&#8674; loop-back</span><span style="color:#a78bfa">&#8901;&#8901; updates Register</span></div>
<div id="wrap"><svg id="map" viewBox="0 0 1000 1000" role="img" aria-label="Realm Flow Map"></svg></div>
<div id="list"></div>
<div id="links"><b>Links</b>
<a href="https://script.google.com/macros/s/AKfycbxhGb1O-6S6C2PJS92EEuViEBDu0wj2AGTzgkGtm_7MixmXsepE-XxF9rgly0f6SwARGw/exec?authuser=info@realmpcs.com" target="_blank" rel="noopener">Realm Desk v9</a>
<a href="https://script.google.com/macros/s/AKfycbwFil-RiQujoffiDoBnGk6YvjLuyr1vaqCQKVUPtWT9NmGVQryPcwEsjIlieL93Yps/exec?authuser=info@realmpcs.com" target="_blank" rel="noopener">Cert Studio</a>

<a href="https://script.google.com/macros/s/AKfycbyraSxweXHy2Io-vI4rJ9pGskyKzIedY1PdtYPYtybupFfovZsoP7ROLWEvdAnZIcs/exec?authuser=info@realmpcs.com" target="_blank" rel="noopener">24 Sep original</a>
<button id="wipe" style="margin-top:12px">Reset map to defaults</button></div>
<script>
const KEY='realm_flow_map_v3',NS='http://www.w3.org/2000/svg';let MEM=null;
const DESK='https://script.google.com/macros/s/AKfycbxhGb1O-6S6C2PJS92EEuViEBDu0wj2AGTzgkGtm_7MixmXsepE-XxF9rgly0f6SwARGw/exec?authuser=info@realmpcs.com',CERT='https://script.google.com/macros/s/AKfycbwFil-RiQujoffiDoBnGk6YvjLuyr1vaqCQKVUPtWT9NmGVQryPcwEsjIlieL93Yps/exec?authuser=info@realmpcs.com',YGMB='./notes.html',BOOKS='https://books.zoho.com/app',CAL='https://calendar.google.com/calendar/r?authuser=info@realmpcs.com',REG='https://docs.google.com/spreadsheets/d/1REJWxu7oD3MY9z7TCPsv-OznnPTu1lAHsONMlU8refM/edit?authuser=info@realmpcs.com';
function defaults(){const s=[['Enquiry','Gmail · 1300 SipTalk · WhatsApp','https://mail.google.com/mail/?authuser=info@realmpcs.com#inbox'],['Log','You Got Me Bro',YGMB],['Quote','Zoho Books',BOOKS+'#/quotes'],['Follow-up','You Got Me Bro',YGMB],['Book','Google Calendar',CAL],['Roster','Deputy (look-only)','https://once.deputy.com'],['Job day','Desk v9',DESK],['Cert','Cert Studio',CERT],['Invoice','Zoho Books',BOOKS+'#/invoices'],['Close','Open Register',REG]];
 return {nodes:s.map((x,i)=>({id:'s'+(i+1),n:i+1,title:x[0],tool:x[1],link:x[2],note:''})).concat([{id:'ara',n:0,title:'Ara',tool:'head · reads logs',link:'',note:''},{id:'nova',n:0,title:'Nova',tool:'writes code · own log',link:'',note:''}])}}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){d=MEM}return d&&Array.isArray(d.nodes)?d:defaults()}
function save(){const t=JSON.stringify(S);try{localStorage.setItem(KEY,t)}catch(e){MEM=JSON.parse(t)}}
let S=load(),sel=null;
const C=500,R=390,POS=i=>{const a=-Math.PI/2+i*2*Math.PI/10;return [C+R*Math.cos(a),C+R*Math.sin(a)]},NR=62;
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
const svg=document.getElementById('map');
function edge(p,q,dash,col,bend,r1,r2){const dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;const a=[p[0]+ux*r1,p[1]+uy*r1],b=[q[0]-ux*r2,q[1]-uy*r2];
 const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,cx=mx+(C-mx)*bend,cy=my+(C-my)*bend;
 el('path',{d:`M${a[0]},${a[1]} Q${cx},${cy} ${b[0]},${b[1]}`,fill:'none',stroke:col,'stroke-width':dash?2.5:4,'stroke-dasharray':dash||'','marker-end':'url(#ah'+(col=='#22d3ee'?'m':col=='#f59e0b'?'l':'r')+')'})}
function draw(){svg.innerHTML='';const d=el('defs',{});[['m','#22d3ee'],['l','#f59e0b'],['r','#a78bfa']].forEach(([k,c])=>{const m=el('marker',{id:'ah'+k,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},d);el('path',{d:'M0,0L10,5L0,10z',fill:c},m)});
 const cal=[C,C-60],reg=[C,C+75];
 for(let i=0;i<10;i++)edge(POS(i),reg,'3 7','#a78bfa',0,NR,58);
 for(let i=0;i<10;i++)edge(POS(i),POS((i+1)%10),'','#22d3ee',-0.12,NR+2,NR+4);
 [[3,5],[4,3],[8,2],[10,4]].forEach(([a,b])=>edge(POS(a-1),POS(b-1),'10 7','#f59e0b',a==10?0.35:a==4?-0.35:0.55,NR+2,NR+4));
 const hub=(p,r,f,t1,t2,u)=>{const g=el('g',{class:'node'});el('circle',{cx:p[0],cy:p[1],r,fill:f,stroke:'#fff','stroke-width':3},g);el('text',{x:p[0],y:p[1]-2,class:'nt'},g).textContent=t1;el('text',{x:p[0],y:p[1]+16,class:'ns'},g).textContent=t2;g.onclick=()=>window.open(u,'_blank')};
 hub(cal,70,'#14532d','Google Calendar','source of truth',CAL);hub(reg,58,'#3b0764','Register','every step',REG);
 S.nodes.forEach((n,k)=>{const p=n.n?POS(n.n-1):(n.id=='ara'?[70,935]:[930,935]);const r=n.n?NR:52;const g=el('g',{class:'node'+(sel==n.id?' sel':''),'data-id':n.id});
  el('circle',{cx:p[0],cy:p[1],r,fill:n.n?'#0f2a47':'#334155',stroke:n.n?'#22d3ee':'#94a3b8','stroke-width':4,'stroke-dasharray':n.n?'':'6 4'},g);
  el('text',{x:p[0],y:p[1]-4,class:'nt'},g).textContent=(n.n?n.n+' ':'')+n.title;
  const t=n.tool.length>18?n.tool.slice(0,17)+'…':n.tool;el('text',{x:p[0],y:p[1]+16,class:'ns'},g).textContent=t;
  g.onclick=()=>{sel=n.id;draw();const c=document.getElementById('c_'+n.id);c&&c.scrollIntoView({behavior:'smooth',block:'center'})}})}
let rec=null;
function dictate(n,btn,ta){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice not supported in this browser.');return}
 if(rec){rec.stop();return}rec=new SR();rec.lang='en-AU';rec.interimResults=false;btn.classList.add('on');
 rec.onresult=e=>{const t=e.results[0][0].transcript;/* voice only ever appends text; it cannot delete or skip the PIN */ta.value=(ta.value?ta.value+' ':'')+t;n.note=ta.value;save()};
 rec.onend=()=>{btn.classList.remove('on');rec=null};rec.start()}
function list(){const L=document.getElementById('list');L.innerHTML='';S.nodes.forEach(n=>{const c=document.createElement('div');c.className='card';c.id='c_'+n.id;
 c.innerHTML=`<b contenteditable="true"></b>${n.link?`<a target="_blank" rel="noopener"></a>`:''}<button class="mic" title="Dictate a note" aria-label="Dictate a note"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="8.25" y="2.5" width="7.5" height="12.5" rx="3.75" fill="currentColor"/><path d="M5.25 11.25a6.75 6.75 0 0 0 13.5 0M12 18v3.25" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg></button><button class="clr">Clear note</button><textarea placeholder="Notes"></textarea>`;
 const b=c.querySelector('b'),ta=c.querySelector('textarea');b.textContent=(n.n?n.n+'. ':'')+n.title+' · '+n.tool;ta.value=n.note||'';
 if(n.link){const a=c.querySelector('a');a.href=n.link;a.textContent='open'}
 b.onblur=()=>{const v=b.textContent.replace(/^\d+\.\s*/,'');const i=v.indexOf(' · ');n.title=(i<0?v:v.slice(0,i)).trim()||n.title;if(i>=0)n.tool=v.slice(i+3).trim();save();draw()};
 ta.oninput=()=>{n.note=ta.value;save()};c.querySelector('.mic').onclick=e=>dictate(n,e.target,ta);
 c.querySelector('.clr').onclick=()=>{if(!ta.value)return;gate('Delete the note on "'+n.title+'"?').then(ok=>{if(!ok)return;n.note='';ta.value='';save()})};L.appendChild(c)})}
document.getElementById('wipe').onclick=()=>gate('Reset the map to defaults? Your edits and notes in this browser are deleted.').then(ok=>{if(ok){S=defaults();save();draw();list()}});
draw();list();
</script><script>
/* PIN gate removed 15 Oct 2026 (rule 43: opens with one click, no login). Deletes still need two confirms. */
window.gate=function(q){return Promise.resolve(confirm(q)&&confirm("Are you sure? This can't be undone."))};
</script>
